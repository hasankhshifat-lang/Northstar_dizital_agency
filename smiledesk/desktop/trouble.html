<!doctype html>
<!--
  What the SmileDesk window shows when SmileDesk can't start (desktop/main.cjs showTrouble), instead of a blank
  window: what went wrong in plain words, Try again, and where the logs are. The Northstar mark on top.
  Its reason comes in the address (?reason=…&detail=…&logs=…).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>SmileDesk</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; }
  [hidden] { display: none !important; }
  body { display: flex; align-items: center; justify-content: center; font: 13px/18px -apple-system, system-ui, sans-serif; color: #0A0A0A; -webkit-app-region: drag; }
  .card { display: flex; flex-direction: column; align-items: center; max-width: 380px; padding: 0 24px; text-align: center; }
  .boppy { width: 70px; height: 72px; margin-bottom: 18px; }
  h1 { margin: 0; font-size: 15px; line-height: 20px; font-weight: 600; }
  p { margin: 6px 0 0; color: #6B6B6B; }
  .detail { margin-top: 10px; font: 11.5px/16px ui-monospace, SFMono-Regular, Menlo, monospace; color: #6B6B6B; word-break: break-word; -webkit-app-region: no-drag; user-select: text; }
  .actions { display: flex; gap: 8px; margin-top: 20px; -webkit-app-region: no-drag; }
  button { border: 0; border-radius: 999px; padding: 7px 14px; font: 500 13px/16px -apple-system, system-ui, sans-serif; cursor: pointer; }
  .primary { background: #0A0A0A; color: #fff; }
  .secondary { background: #F2F2F0; color: #0A0A0A; }
  .secondary:hover { background: #EAEAE7; }
  button:disabled { opacity: 0.5; cursor: default; }
  .logs { margin-top: 14px; font-size: 12px; color: #9A9A98; -webkit-app-region: no-drag; user-select: text; }
</style>
</head>
<body>
  <div class="card">
    <img class="boppy" src="northstar-mark.png" alt="" width="70" height="72">
    <h1 id="title">SmileDesk couldn't start</h1>
    <p id="line"></p>
    <div class="detail" id="detail" hidden></div>
    <div class="actions">
      <button class="primary" id="retry">Try again</button>
      <button class="secondary" id="logs">Show logs</button>
    </div>
    <div class="logs" id="where"></div>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    const reason = q.get("reason") || "error";
    const detail = q.get("detail") || "";
    // What happened, and what the person can do about it. No jargon past the detail line.
    const lines = {
      "port-taken": ["Another app is using SmileDesk's spot", "SmileDesk needs port 3210 on this Mac, and another app has it. Quit that app, then try again."],
      "other-bops": ["SmileDesk is already open somewhere else", "Another copy of SmileDesk, maybe in another account on this Mac, is using its spot. Quit it there, then try again."],
      "server-ended": ["SmileDesk stopped while starting", "Its background part closed right away. Security software sometimes stops it; the logs say why."],
      "page-failed": ["SmileDesk's window can't load", "Its page didn't load several times in the last two minutes. Try again, and if it happens again, send us the logs."],
      "page-crashed": ["SmileDesk's window keeps crashing", "Its page stopped several times in the last two minutes. Try again, and if it happens again, send us the logs."],
      "server-crashed": ["SmileDesk keeps stopping", "Its background part stopped several times in the last two minutes. Try again, and if it happens again, send us the logs."],
      "server-slow": ["SmileDesk is taking too long to start", "Its background part didn't answer in time. Try again, and if it happens again, send us the logs."],
      error: ["SmileDesk couldn't start", "Something went wrong getting ready. Try again, and if it happens again, send us the logs."],
    };
    const [title, line] = Object.hasOwn(lines, reason) ? lines[reason] : lines.error;
    document.getElementById("title").textContent = title;
    document.getElementById("line").textContent = line;
    if (detail) {
      const d = document.getElementById("detail");
      d.textContent = reason === "port-taken" || reason === "other-bops" ? `Using it: ${detail}` : detail;
      d.hidden = false;
    }
    const where = q.get("logs");
    if (where) document.getElementById("where").textContent = where.replace(/^\/Users\/[^/]+/, "~");
    const mac = window.bopsMac;
    const retry = document.getElementById("retry");
    retry.onclick = () => {
      retry.disabled = true;
      retry.textContent = "Starting…";
      Promise.resolve(mac?.startup?.retry()).catch(() => {
        retry.disabled = false;
        retry.textContent = "Try again";
      });
    };
    document.getElementById("logs").onclick = () => mac?.startup?.logs();
    if (!mac?.startup) document.querySelector(".actions").hidden = true;
  </script>
</body>
</html>
