  g.save(); const gr = g.createLinearGradient(0, SUB_Y - 160, 0, SUB_Y + 260); gr.addColorStop(0, 'rgba(6,10,15,0)'); gr.addColorStop(.5, 'rgba(6,10,15,.42)'); gr.addColorStop(1, 'rgba(6,10,15,0)');
  g.fillStyle = gr; g.fillRect(0, SUB_Y - 160, Wd, 420); g.restore();
  if (!c) return;
  const a = ss(seg(t, c.t0 - .12, c.t0 + .08)) * (1 - ss(seg(t, c.t1 - .08, c.t1 + .12)));
  const lines = c.en.split('|'), X = 92;
  g.save(); g.globalAlpha = a; g.fillStyle = C.amber; g.fillRect(X - 26, SUB_Y - 30, 5, lines.length * 60); g.restore();
  lines.forEach((s, i) => txt(s, X, SUB_Y + i * 60, { size: 50, w: 500, sp: 1.2, align: 'left', col: C.light, a, id: 'sub' + i, nobox: true }));
}
function credits(t) {
  const a = .62;
  txt('FACTS NPS · JOHNSTOWN AREA HERITAGE ASSN. · ELEVATION AWS TERRAIN TILES', Wd - 36, 250, { size: 15, w: 500, sp: 1.2, align: 'right', col: 'rgba(240,232,216,.9)', a, id: 'cr1', nobox: true });
  txt('IMAGERY SENTINEL-2 CLOUDLESS 2016 BY EOX (CC BY 4.0) · RIVER, PLACES © OPENSTREETMAP (ODbL) · RELIEF ×3', Wd - 36, 272, { size: 15, w: 500, sp: 1.2, align: 'right', col: 'rgba(240,232,216,.9)', a, id: 'cr2', nobox: true });
}

// ---------- the frame at film time t ----------
function frame(t) {
  TX = [];
  const dist = setCamera(t);
  // the section cut
  const cutOn = t >= K.cut && t < K.close + .9;
  const open = eio(seg(t, K.cut, K.cut + .9)) * (1 - eio(seg(t, K.close, K.close + .9)));
  CUT.p.set(SEC.P0.x, SEC.P0.z, SEC.nx, SEC.nz); CUT.d.value = cutOn ? .001 + 60 * open : 0;
  wall.mesh.visible = cutOn && open > .02; wall.m.uniforms.op.value = ss(seg(open, 0, .3));
  // the lake: fills at K.lake, drains after the breach
  setLakeLevel(lerp(0, 22, eio(seg(t, K.breach + .1, K.breach + 4.5))));
  lakeU.op.value = ss(seg(t, K.lake - .2, K.lake + .9));
  // the dam: the middle goes at the breach
  const br = eo(seg(t, K.breach, K.breach + .5)); damMid.visible = br < 1; damMid.scale.set(1, 1 - br, 1);
  damL.visible = damR.visible = true;
  // the ruler: drawn from the town up to the dam, 7.0 → 10.6
  { const k = eio(seg(t, 6.6, 10.4)); rv(ruler, { revB: k * ruler.L, inten: ss(seg(t, 6.6, 6.9)) * (1 - ss(seg(t, 13.0, 13.8))), soft: .2 }); }
  // the flood: ignites at the breach and runs to the Stone Bridge
  const hs = headS(t), on = t >= K.breach + .25 ? 1 : 0, far = lerp(.7, 1, ss(seg(dist, 2, 6)));
  rv(flood.wash, { revB: hs, inten: on * .9, soft: .4 });
  rv(flood.glow, { revB: hs, inten: on * far, soft: .3 });
  rv(flood.core, { revB: hs, inten: on, head: hs, headAmt: 3.2 * (1 - ss(seg(runK(t), .95, 1))), headW: lerp(.25, .6, ss(seg(dist, 3, 10))), flowPh: t * 1.6, soft: .25 });
  // the pile: grows on "piled", slab by slab, then burns
  PILE.grp.visible = t >= K.piled - .1 && t < 44.2; PILE.grp.scale.setScalar(1 - ss(seg(t, 42.8, 44.2)) * .999); growPile(eio(seg(t, K.piled, K.piled + 1.6)));
  const fire = ss(seg(t, K.fire, K.fire + .6)) * (1 - ss(seg(t, 46, 48)) * .5);
  const fl = .75 + .25 * Math.sin(t * 23.0) * Math.sin(t * 7.3 + 1.1);
  PILE.mat.color.setHex(0xffb04a).lerp(new THREE.Color(0xff5a2a), fire); PILE.mat.emissive.setHex(0xff9a2e).lerp(new THREE.Color(0xff3a10), fire);
  PILE.mat.emissiveIntensity = .4 + fire * .9 * fl; PILE.edgeM.color.setHex(0xffb04a).lerp(new THREE.Color(0xff6a30), fire).multiplyScalar(2.2 + fire * fl);
  // depth of field: aperture grows with distance; deeper in the section
  post.dof.focus = dist; post.dof.aper = dist * (t > K.cut && t < K.close + .9 ? 2.5 : 4.0);
  post.bloom.strength = .6; VU.fade.value = ss(seg(t, 0, .5)) * (1 - ss(seg(t, FULL - .8, FULL)) * .0);
  post.composer.render();
  // overlay
  g.setTransform(2, 0, 0, 2, 0, 0); g.clearRect(0, 0, Wd, Ht);
  mapLabels(t); townPin(t); climbLabels(t); sectionLabels(t); clock(t); runLabels(t); pileLabels(t); count(t);
  if (!Q.has('nosubs')) subtitles(t);
  credits(t);
}

window.DUR = T1 - T0;
window.render = t => frame(t + T0);
window.TEXTS = t => { window.render(t); return TX.map(o => ({ ...o })); };
const EVF = [
  { t: 0.5, type: 'pin' }, { t: 4.8, type: 'whoosh' }, { t: 6.6, type: 'ruler' }, { t: 10.4, type: 'tick' }, { t: K.lake, type: 'lake' }, { t: K.dam, type: 'dam' },
  { t: 12.9, type: 'orbit' }, { t: K.cut, type: 'cut' }, { t: K.cut + 1.6, type: 'sound' }, { t: K.cut + 2.4, type: 'tick' },
  { t: K.close, type: 'close' }, { t: K.clock, type: 'tick' }, { t: K.breach, type: 'breach' }, { t: K.breach + .25, type: 'ignite' },
  { t: K.breach + .25, type: 'rush', t1: K.arrive }, { t: K.arrive, type: 'impact' },
  { t: 28.4, type: 'stat' }, { t: 30.9, type: 'tick' }, { t: 35.6, type: 'whoosh' },
  ...Array.from({ length: 8 }, (_, i) => ({ t: K.piled + 1.6 * eioInv((i + .5) / 8), type: 'slab', i })),
  { t: K.fire, type: 'fire' }, { t: K.count, type: 'count' }, { t: FULL - 2.5, type: 'close2' }];
function eioInv(y) { let lo = 0, hi = 1; for (let i = 0; i < 30; i++) { const m = (lo + hi) / 2; if (eio(m) < y) lo = m; else hi = m; } return lo; }
window.EV = EVF.map(e => ({ ...e, t: e.t - T0, ...(e.t1 ? { t1: e.t1 - T0 } : {}) })).filter(e => e.t >= 0 && e.t <= T1 - T0);
window.render(0);
window.READY = true;
</script>
