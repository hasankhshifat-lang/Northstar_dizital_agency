<script type="module">
// higuita-1995-short - "Night Match Toon" with caricatures: Foot All FC's own 2.5D vector style (not a lemo-opuscar template).
// A real perspective camera over a 3D pitch; flat vector players drawn as billboards with cel shading, smooth per-frame
// motion, eyes that track the ball; neon-lit night stadium; broadcast-style scorebug + shootout tracker; word-by-word captions.
// Only the renderer (core/render/*.mjs) and the maths helpers of /core/lib.js are shared with lemo-opuscar.
import { mulberry, clamp, lerp, ss, eio, eo, ei, back } from '/core/lib.js';

const W = innerWidth, H = innerHeight;           // 1080 x 1920
const cv = document.getElementById('c'); cv.width = W; cv.height = H;

const WORDS = (await (await fetch('vo/words.json')).json()).words;
let NOW = 0;
const THUMB = new URLSearchParams(location.search).get('thumb');   // ?thumb=SECONDS: a clean frame for the thumbnail art

// ---------------------------------------------------------------- palette
const C = {

  grass: '#2F8F4E', grass2: '#287F44', line: '#F4F7FF', glow: '#FFE9A8',
  cze: '#E0313A', czeD: '#A81F2A', czeS: '#F4F4F4', czeSo: '#2B4DB3',
  frg: '#F5F5F2', frgD: '#C9CCD6', frgS: '#1E1E24', frgSo: '#F5F5F2',
  gkM: '#5B6372', gkMD: '#3F4655', gkV: '#E8C531', gkVD: '#B99A1C', gkT: '#3FAE6A', gkTD: '#2A7F4C',
  skin: '#F2C29B', skinD: '#D9A27A', yel: '#FFD23F', red: '#FF4D5E', white: '#FFFFFF',
};
const KIT = {   // caricatures: recognisable by hair, moustache and build; generic kits (no crests or sponsors)
  hig: { shirt: '#6B3FA0', shade: '#4E2C7A', shorts: '#1E1E28', socks: '#6B3FA0', skin: '#C98B5E', skinD: '#A86E45', hair: '#15100E', style: 'mane', stache: true, head: 1.32, nose: 3.4, brow: '#15100E', browW: 3.2, gloves: true, glove: '#F2D02E' },
  red: { shirt: '#F5F5F2', shade: '#C9CCD6', shorts: '#1E2A5A', socks: '#F5F5F2', hair: '#6B4423', style: 'parted', head: 1.22, nose: 2.4 },
  ref: { shirt: '#17181F', shade: '#0B0B10', shorts: '#17181F', socks: '#17181F', hair: '#3B2A1E', style: 'short', head: 1.1 },
  col: { shirt: '#F2D02E', shade: '#C9A81E', shorts: '#1E3F9A', socks: '#D7263D', hair: '#15100E', style: 'curly', skin: '#B9794C', skinD: '#995F37' },
};

// ---------------------------------------------------------------- timeline (from the VibeVoice take's word timings, vo/words.json)
window.DUR = 51.2;
const T = {
  heels0: 2.95, upside: 4.0, sB: 6.4, vs: 7.6, friendly: 9.5, wrong: 10.2, sC: 13.1, loco: 16.0, madman: 16.35,
  sD: 18.8, lobK: 19.6, notHig: 24.15, sE: 26.5, flips: 27.1, heel: 29.4, sF: 31.6, sG: 34.4, flag: 35.9, noNeed: 37.4,
  sH: 39.9, sI: 44.1, forgot: 45.6, sJ: 48.3, endPull: 50, end: 51.2,
};
const CAPS = [
  [0.0, 'Most goalkeepers stop the ball with their hands.'], [2.6, 'This one… used his heels.'], [4.7, 'Upside down.'],
  [5.6, 'September 6, 1995. Wembley.'], [7.9, 'England against Colombia.'], [9.5, 'Just a friendly. What could possibly go wrong?'],
  [12.4, 'In goal for Colombia: René Higuita.'], [14.9, 'His nickname? El Loco. The madman.'],
  [18.5, 'Jamie Redknapp tries a lob from 30 yards.'], [21.0, 'A soft, easy ball. Any keeper would just catch it.'],
  [24.7, 'Not Higuita.'], [25.6, 'He dives forward… flips his legs over his head…'], [28.3, '…and kicks it away with his heels.'],
  [30.7, '20,000 people at Wembley had never seen anything like it.'],
  [34.0, 'And the funniest part? The flag was already up for offside.'], [37.8, 'He didn’t even need to save it.'],
  [39.6, 'It wasn’t luck, either. He later said he’d practised it… all through the warm-up.'],
  [44.1, 'The match ended nil-nil. Nobody remembers the score.'],
  [47.9, 'Would you try this in goal?'], [49.8, 'Tell me in the comments.'],
];

// ---------------------------------------------------------------- sound events (mix.py reads these)
const EV = [{ t: 0, type: 'vo', id: 'narration' }];
const ev = (t, type, o = {}) => EV.push({ t, type, ...o });

// ---------------------------------------------------------------- camera + projection
let CAM = { x: 0, y: 1.3, z: 16, yaw: 0, pitch: .06, f: 1500, cy: H * .44 };
function P(wx, wy, wz) {
  const dx = wx - CAM.x, dy = wy - CAM.y, dz = wz - CAM.z;
  const cy = Math.cos(CAM.yaw), sy = Math.sin(CAM.yaw);
  const x1 = dx * cy - dz * sy, z1 = dx * sy + dz * cy;
  const d = -z1, cp = Math.cos(CAM.pitch), sp = Math.sin(CAM.pitch);
  const y2 = dy * cp + d * sp, d2 = d * cp - dy * sp;
  return { x: W / 2 + CAM.f * x1 / d2, y: (CAM.cy || H * .44) - CAM.f * y2 / d2, s: CAM.f / d2, d: d2 };
}
const horizonY = () => (CAM.cy || H * .44) - CAM.f * Math.tan(CAM.pitch);
function camTrack(keys, t) {   // keys: [[t, {x,y,z,yaw,pitch,f}], ...] eased
  if (t <= keys[0][0]) return { ...CAM, ...keys[0][1] };
  for (let i = 0; i < keys.length - 1; i++) {
    const [t0, a] = keys[i], [t1, b] = keys[i + 1];
    if (t < t1) { const k = eio((t - t0) / (t1 - t0)); const o = { ...CAM }; for (const key in b) o[key] = lerp(a[key] ?? CAM[key], b[key], k); for (const key in a) if (!(key in b)) o[key] = a[key]; return o; }
  }
  return { ...CAM, ...keys[keys.length - 1][1] };
}

// ---------------------------------------------------------------- the night stadium (screen-space backdrop with yaw parallax)
const R0 = mulberry(5);
const CROWD = (() => {   // a wide strip of tiny heads in team colours
  const c = document.createElement('canvas'); c.width = 3600; c.height = 420; const g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 0, 420); grd.addColorStop(0, '#1A1F46'); grd.addColorStop(1, '#2A2F63'); g.fillStyle = grd; g.fillRect(0, 0, 3600, 420);
  const cols = ['#E0313A', '#F5F5F2', '#2B4DB3', '#C9B7FF', '#E0313A', '#8E96C8', '#F5F5F2', '#5B66A8'];
  for (let row = 0; row < 26; row++) for (let i = 0; i < 260; i++) {
    const x = i * 14 + (row % 2) * 7 + R0() * 3, y = 8 + row * 16;
    g.globalAlpha = .45 + .55 * (row / 26); g.fillStyle = cols[Math.floor(R0() * cols.length)];
    g.beginPath(); g.arc(x, y, 4.2 + row * .08, 0, 7); g.fill();
  }
  g.globalAlpha = 1; return c;
})();
const STARS = Array.from({ length: 90 }, () => [R0() * W, R0(), R0() * 1.6 + .4, R0() * 6]);
const FLASH = Array.from({ length: 70 }, () => [R0() * 3600, R0() * 400, R0() * 10]);
function sky(t, mode) {
  const hy = horizonY();
  if (mode === 'day') {
    const g = X.createLinearGradient(0, hy - 1400, 0, hy); g.addColorStop(0, '#7EC8F2'); g.addColorStop(.7, '#BDE3F5'); g.addColorStop(1, '#FBE2B8');
    X.fillStyle = g; X.fillRect(0, 0, W, Math.max(0, hy) + 2);
    // training ground: trees and a fence
    X.fillStyle = '#5D9C5A'; for (let i = -2; i < 14; i++) { const x = i * 110 - CAM.yaw * 900 % 110, r = 70 + 30 * Math.sin(i * 2.1); X.beginPath(); X.arc(x, hy - 40, r, Math.PI, 0); X.fill(); }
    X.fillStyle = '#4C8A4C'; X.fillRect(0, hy - 42, W, 44);
    X.strokeStyle = 'rgba(255,255,255,.75)'; X.lineWidth = 4; X.beginPath(); X.moveTo(0, hy - 10); X.lineTo(W, hy - 10); X.stroke();
    for (let i = 0; i < 30; i++) { const x = i * 40 - (CAM.yaw * 1400) % 40; X.beginPath(); X.moveTo(x, hy - 30); X.lineTo(x, hy); X.stroke(); }
    return;
  }
  const g = X.createLinearGradient(0, hy - 1500, 0, hy); g.addColorStop(0, C.sky0); g.addColorStop(.55, C.sky1); g.addColorStop(1, C.sky2);
  X.fillStyle = g; X.fillRect(0, 0, W, Math.max(0, hy) + 2);
  for (const [x, y, r, ph] of STARS) { const yy = hy - 700 - y * 1300; if (yy < -10 || yy > hy - 330) continue; X.globalAlpha = .4 + .4 * Math.sin(t * 2 + ph); X.fillStyle = '#DDE4FF'; X.beginPath(); X.arc((x - CAM.yaw * 400 + W) % W, yy, r, 0, 7); X.fill(); }
  X.globalAlpha = 1;
  // the stands: a curved bowl band with the crowd texture, parallax with yaw
  const off = (-CAM.yaw * 1300) % 1200 - 1200;
  const top = hy - 300;
  X.save(); X.beginPath(); X.moveTo(0, hy + 4);
  for (let x = 0; x <= W; x += 30) X.lineTo(x, top + 40 * Math.cos((x / W - .5) * 2.2));
  X.lineTo(W, hy + 4); X.closePath(); X.clip();
  for (let k = 0; k < 3; k++) X.drawImage(CROWD, 0, 0, 3600, 420, off + k * 1200 * 3, top - 20, 3600, 320);
  // camera flashes
  for (const [fx, fy, ph] of FLASH) { const a = Math.max(0, Math.sin(t * 3.3 + ph * 7)) ** 30; if (a < .05) continue; X.globalAlpha = a; X.fillStyle = '#FFFFFF'; X.beginPath(); X.arc((fx + off + 3600) % W, top + fy * .7, 5, 0, 7); X.fill(); }
  X.globalAlpha = 1;
  X.restore();
  // roof rim
  X.strokeStyle = '#0D1230'; X.lineWidth = 16; X.beginPath(); for (let x = 0; x <= W; x += 30) { const y = top + 40 * Math.cos((x / W - .5) * 2.2); x ? X.lineTo(x, y) : X.moveTo(x, y); } X.stroke();
  // floodlight towers with light cones
  for (const [bx, sc] of [[-260, 1], [W + 260, 1], [250, .55], [W - 250, .55]]) {
    const x = bx - CAM.yaw * 1500 * sc, y = top - 260 * sc;
    X.save(); X.globalCompositeOperation = 'lighter';
    const rg = X.createRadialGradient(x, y, 10, x, y, 520 * sc); rg.addColorStop(0, 'rgba(255,240,200,.55)'); rg.addColorStop(1, 'rgba(255,240,200,0)');
    X.fillStyle = rg; X.beginPath(); X.arc(x, y, 520 * sc, 0, 7); X.fill();
    X.fillStyle = 'rgba(255,240,200,.07)'; X.beginPath(); X.moveTo(x - 60 * sc, y); X.lineTo(x + 60 * sc, y); X.lineTo(W / 2 + (x - W / 2) * .2 + 300, hy + 200); X.lineTo(W / 2 + (x - W / 2) * .2 - 300, hy + 200); X.closePath(); X.fill();
    X.restore();
    X.fillStyle = '#0D1230'; X.fillRect(x - 8 * sc, y, 16 * sc, top + 60 - y);
    X.fillStyle = '#FFF4D6'; X.beginPath(); X.roundRect(x - 70 * sc, y - 30 * sc, 140 * sc, 50 * sc, 8); X.fill();
    X.strokeStyle = '#0D1230'; X.lineWidth = 3; for (let i = 1; i < 4; i++) { X.beginPath(); X.moveTo(x - 70 * sc + i * 35 * sc, y - 30 * sc); X.lineTo(x - 70 * sc + i * 35 * sc, y + 20 * sc); X.stroke(); }
  }
  // haze over the pitch edge
  const hz = X.createLinearGradient(0, hy - 120, 0, hy + 40); hz.addColorStop(0, 'rgba(106,91,194,0)'); hz.addColorStop(1, 'rgba(160,150,255,.35)');
  X.fillStyle = hz; X.fillRect(0, hy - 120, W, 160);
}
// ---------------------------------------------------------------- the pitch in perspective
function poly(pts, fill, stroke, lw) {
  const q = pts.map(p => P(p[0], p[1], p[2])); if (q.some(p => p.d < .4)) return false;
  X.beginPath(); q.forEach((p, i) => i ? X.lineTo(p.x, p.y) : X.moveTo(p.x, p.y)); X.closePath();
  if (fill) { X.fillStyle = fill; X.fill(); } if (stroke) { X.strokeStyle = stroke; X.lineWidth = lw; X.stroke(); } return true;
}
function wline(pts, col, wm) {   // a world-space polyline whose width shrinks with distance (wm = metres)
  for (let i = 1; i < pts.length; i++) {
    const a = P(...pts[i - 1]), b = P(...pts[i]); if (a.d < .4 || b.d < .4) continue;
    X.strokeStyle = col; X.lineWidth = Math.max(1, wm * (a.s + b.s) / 2); X.lineCap = 'round'; X.beginPath(); X.moveTo(a.x, a.y); X.lineTo(b.x, b.y); X.stroke();
  }
}
function pitch(t, mode) {
  const hy = horizonY();
  X.fillStyle = mode === 'day' ? '#62B05E' : C.grass; X.fillRect(0, hy, W, H - hy);
  const g2 = mode === 'day' ? '#58A354' : C.grass2;
  for (let z = -60; z < 60; z += 4) if ((z / 4) % 2 === 0) {
    // split each stripe into chunks so nothing crosses the near plane
    for (let z0 = z; z0 < z + 4; z0 += 1) poly([[-70, 0, z0], [70, 0, z0], [70, 0, z0 + 1], [-70, 0, z0 + 1]], g2);
  }
  const L = mode === 'day' ? 'rgba(255,255,255,.85)' : C.line;
  wline([[-34, 0, 0], [34, 0, 0]], L, .12);                                     // goal line
  wline([[-20.16, 0, 0], [-20.16, 0, 16.5], [20.16, 0, 16.5], [20.16, 0, 0]], L, .12);   // penalty area
  wline([[-9.16, 0, 0], [-9.16, 0, 5.5], [9.16, 0, 5.5], [9.16, 0, 0]], L, .12);         // six-yard box
  const arc = []; for (let a = -.93; a <= .93; a += .06) arc.push([Math.sin(a) * 9.15, 0, 11 + Math.cos(a) * 9.15]); wline(arc.filter(p => p[2] > 16.5), L, .12);
  const s = P(0, 0, 11); if (s.d > .4) { X.fillStyle = L; X.beginPath(); X.ellipse(s.x, s.y, .14 * s.s, .06 * s.s, 0, 0, 7); X.fill(); }
  // light pools on the grass
  if (mode !== 'day') { X.save(); X.globalCompositeOperation = 'soft-light'; const rg = X.createRadialGradient(W / 2, hy + 300, 50, W / 2, hy + 300, 900); rg.addColorStop(0, 'rgba(255,255,220,.5)'); rg.addColorStop(1, 'rgba(0,0,0,.35)'); X.fillStyle = rg; X.fillRect(0, hy, W, H - hy); X.restore(); }
}
// the goal: posts, bar and a net that bulges where the ball hits
let NET = null;   // {x, y, t0, k}
function goal(t) {
  const back = -2.0, bulge = (x, y) => { if (!NET) return 0; const age = t - NET.t0; if (age < 0) return 0; const d = Math.hypot(x - NET.x, y - NET.y); return NET.k * Math.exp(-d * d / .8) * Math.exp(-age * 2.2) * (1 + .3 * Math.sin(age * 18)); };
  X.save(); X.globalAlpha = .55;
  for (let i = 0; i <= 14; i++) { const x = -3.66 + i * 7.32 / 14; const pts = []; for (let j = 0; j <= 6; j++) { const y = 2.44 * (1 - j / 6); pts.push([x, y, back * (.55 + .45 * (1 - y / 2.44)) - bulge(x, y)]); } pts.unshift([x, 2.44, -.05]); wline(pts, '#E9EEFF', .025); }
  for (let j = 0; j <= 6; j++) { const y = 2.44 * j / 6; const pts = []; for (let i = 0; i <= 14; i++) { const x = -3.66 + i * 7.32 / 14; pts.push([x, y, back * (.55 + .45 * (1 - y / 2.44)) - bulge(x, y)]); } wline(pts, '#E9EEFF', .025); }
  for (const sx of [-3.66, 3.66]) { const pts = []; for (let j = 0; j <= 6; j++) { const y = 2.44 * j / 6; pts.push([sx, y, back * (.55 + .45 * (1 - y / 2.44))]); } wline(pts, '#E9EEFF', .025); }
  X.restore();
  wline([[-3.66, 0, 0], [-3.66, 2.44, 0], [3.66, 2.44, 0], [3.66, 0, 0]], C.ink, .2);
  wline([[-3.66, 0, 0], [-3.66, 2.44, 0], [3.66, 2.44, 0], [3.66, 0, 0]], '#FFFFFF', .12);
}

// ---------------------------------------------------------------- vector players (billboards)
// pose: angles in degrees, 0 = hanging straight down, positive = towards screen right. lean/rot in degrees, crouch in units.
const POSE = {
  idle:   { lean: 0, uL: -10, fL: -6, uR: 10, fR: 6, tL: -4, sL: 0, tR: 4, sR: 0 },
  ready:  { lean: 0, uL: -38, fL: -20, uR: 38, fR: 20, tL: -14, sL: 8, tR: 14, sR: -8, crouch: 8 },
  wide:   { lean: 0, uL: -70, fL: -30, uR: 70, fR: 30, tL: -16, sL: 8, tR: 16, sR: -8, crouch: 10 },
  runA:   { lean: 8, uL: 40, fL: 70, uR: -40, fR: -20, tL: -30, sL: 40, tR: 25, sR: 10 },
  runB:   { lean: 8, uL: -40, fL: -20, uR: 40, fR: 70, tL: 25, sL: 10, tR: -30, sR: 40 },
  plant:  { lean: -4, uL: -40, fL: -10, uR: 30, fR: 20, tL: -8, sL: 0, tR: 30, sR: 60 },
  kick:   { lean: -10, uL: -60, fL: -20, uR: 50, fR: 20, tL: -6, sL: 0, tR: -40, sR: -10 },
  cheer:  { lean: 0, uL: -165, fL: -10, uR: 165, fR: 10, tL: -8, sL: 0, tR: 8, sR: 0 },
  cheerB: { lean: 0, uL: -150, fL: -30, uR: 150, fR: 30, tL: -20, sL: 30, tR: 20, sR: -30, crouch: -10 },
  hands:  { lean: 4, uL: -150, fL: -150, uR: 150, fR: 150, tL: -4, sL: 0, tR: 4, sR: 0 },
  slump:  { lean: 10, uL: -4, fL: 0, uR: 4, fR: 0, tL: -2, sL: 0, tR: 2, sR: 0, crouch: 4 },
  place:  { lean: 0, uL: -30, fL: -20, uR: 12, fR: -8, tL: -34, sL: 60, tR: 34, sR: -60, crouch: 24 },
  armsIn: { lean: 0, uL: 30, fL: 40, uR: -30, fR: -40, tL: -6, sL: 0, tR: 6, sR: 0 },
};
function mixP(a, b, k) { const o = {}; for (const key of new Set([...Object.keys(a), ...Object.keys(b)])) o[key] = lerp(a[key] || 0, b[key] || 0, k); return o; }
function poseTrack(tr, t) {   // [[t, pose], ...] smooth
  if (t <= tr[0][0]) return tr[0][1];
  for (let i = 0; i < tr.length - 1; i++) if (t < tr[i + 1][0]) return mixP(tr[i][1], tr[i + 1][1], eio((t - tr[i][0]) / (tr[i + 1][0] - tr[i][0])));
  return tr[tr.length - 1][1];
}
const runCycle = (t, f = 2.6) => { const k = (Math.sin(t * f * Math.PI * 2) + 1) / 2; return mixP(POSE.runA, POSE.runB, k); };
const dir = a => [Math.sin(a * Math.PI / 180), Math.cos(a * Math.PI / 180)];
function limb(x, y, a, len, w, col, outline = C.ink) {
  const [dx, dy] = dir(a); const ex = x + dx * len, ey = y + dy * len;
  X.lineCap = 'round';
  X.strokeStyle = outline; X.lineWidth = w + 5; X.beginPath(); X.moveTo(x, y); X.lineTo(ex, ey); X.stroke();
  X.strokeStyle = col; X.lineWidth = w; X.beginPath(); X.moveTo(x, y); X.lineTo(ex, ey); X.stroke();
  return [ex, ey];
}
// o: {x, y (feet, screen), k (px per unit; the player is ~100 units tall), kit, view 'front'|'back', pose, rot, look [-1..1, -1..1], expr, mouth, t}
function player(o) {
  const k = o.k, P0 = o.pose, kit = o.kit, front = o.view !== 'back';
  X.save(); X.translate(o.x, o.y);
  // ground shadow
  X.fillStyle = 'rgba(5,10,30,.35)'; X.beginPath(); X.ellipse(0, 0, 26 * k, 6 * k, 0, 0, 7); X.fill();
  X.scale(k, k); X.rotate((o.rot || 0) * Math.PI / 180);
  const cr = P0.crouch || 0, bob = o.bob || 0;
  X.translate(0, cr + bob);
  const hipY = -30;
  X.save(); X.translate(0, hipY); X.rotate((P0.lean || 0) * Math.PI / 180 * (o.leanDir || 1)); X.translate(0, -hipY);
  const drawLegs = () => {
  const LS = o.legScale || 1;
  for (const sd of [-1, 1]) {
    const L = sd < 0 ? 'L' : 'R';
    const hx = sd * 7, hy = hipY + 2;
    const [kx, ky] = limb(hx, hy, P0['t' + L], 15 * LS, 9, kit.skin || C.skin);
    const thighEnd = [hx + dir(P0['t' + L])[0] * 7 * LS, hy + dir(P0['t' + L])[1] * 7 * LS];
    X.strokeStyle = kit.shorts; X.lineWidth = 11; X.beginPath(); X.moveTo(hx, hy); X.lineTo(...thighEnd); X.stroke();
    const sa = P0['t' + L] + P0['s' + L];
    const [fx, fy] = limb(kx, ky, sa, 14 * LS, 8.5, kit.socks);
    X.save(); X.translate(fx, fy); X.rotate(-sa * Math.PI / 180 * .3); X.fillStyle = '#16181F'; X.strokeStyle = C.ink; X.lineWidth = 2.5;
    X.beginPath(); X.ellipse(sd * (front ? 1.5 : -1.5), 1, 6.5, 3.6, 0, 0, 7); X.fill(); X.stroke(); X.restore();
    if (o.feet) o.feet[L] = X.getTransform().transformPoint(new DOMPoint(fx, fy));
  }
  };
  if (!o.legsFront) drawLegs();
  // shorts
  X.fillStyle = kit.shorts; X.strokeStyle = C.ink; X.lineWidth = 2.6;
