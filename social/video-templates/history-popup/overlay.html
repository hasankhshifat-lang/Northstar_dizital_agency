<!doctype html>
<!-- History pop-up overlay (approved style, 2026-11-02). Rendered frame by frame by render.js.
     Transparent background: render.js lays these frames over the real footage. -->
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;overflow:hidden;background:transparent;font-family:"Inter",sans-serif}
  #stage{position:relative;overflow:hidden}
  /* Burned-in caption: lower middle, clear of the Shorts buttons on the right */
  #cap{position:absolute;text-align:center;color:#fff;font-weight:800;line-height:1.18;
       text-shadow:0 4px 0 #000,0 0 18px rgba(0,0,0,.8)}
  #cap .hl{color:#ffd23f}
  /* Pop-up card */
  .pop{position:absolute;transform-origin:0 0;border-radius:22px;background:#fff;padding:6px;
       box-shadow:0 18px 40px rgba(0,0,0,.55);opacity:0}
  .pop img{display:block;width:100%;border-radius:17px;object-fit:cover}
  .pop .name{margin:0;padding:10px 8px 8px;font-weight:800;line-height:1.15;color:#1b130c}
  .pop .sub{display:block;font-weight:600;line-height:1.2;color:#6b5a48;margin-top:2px}
  /* Shorts UI guide (preview only) */
  #ui{display:none;position:absolute;inset:0;color:#fff}
  .guide #ui{display:block}
  #ui .rb{position:absolute;right:28px;width:92px;text-align:center;font:600 22px "Inter"}
  #ui .rb i{display:block;width:84px;height:84px;margin:0 auto 8px;border-radius:50%;background:rgba(255,255,255,.28)}
  #ui .bottom{position:absolute;left:36px;right:170px;bottom:140px;font:600 30px/1.3 "Inter"}
  #ui .bottom b{display:inline-block;width:62px;height:62px;border-radius:50%;background:#c00;vertical-align:middle;margin-right:14px}
  #ui .top{position:absolute;top:60px;right:40px;font:700 34px "Inter";letter-spacing:30px}
</style></head>
<body><div id="stage"><div id="cap"></div><div id="pops"></div>
<div id="ui"><div class="top">🔍 📷 ⋮</div>
  <div class="rb" style="bottom:900px"><i></i>Like</div><div class="rb" style="bottom:770px"><i></i>Dislike</div>
  <div class="rb" style="bottom:640px"><i></i>Comments</div><div class="rb" style="bottom:510px"><i></i>Share</div>
  <div class="rb" style="bottom:380px"><i></i>Remix</div>
  <div class="bottom"><b></b>@channel · Subscribe<br>Video title #shorts</div></div>
</div>
<script>
const ease=t=>1-Math.pow(1-t,3);
const back=t=>{const c=1.7;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
let CFG;
window.init=function(cfg){
  CFG=cfg; const W=cfg.width,H=cfg.height,shorts=H>W;
  const st=document.getElementById('stage'); st.style.width=W+'px'; st.style.height=H+'px';
  if(cfg.guide&&shorts) document.body.classList.add('guide');
  // Layout rules: Shorts = top-left, 30% width, 220px from top, 60px from left (at 1080x1920).
  //               Long (16:9) = top-right, 22% width.
  const s=W/(shorts?1080:1920), cardW=Math.round(W*(shorts?0.30:0.22));
  const top=Math.round((shorts?220:60)*(shorts?s:s)), side=Math.round(60*s);
  const cap=document.getElementById('cap');
  if(shorts){cap.style.left=90*s+'px';cap.style.right=170*s+'px';cap.style.top=1180*s+'px';cap.style.fontSize=66*s+'px';}
  else{cap.style.left=200*s+'px';cap.style.right=200*s+'px';cap.style.bottom=90*s+'px';cap.style.fontSize=54*s+'px';}
  const box=document.getElementById('pops');
  cfg.pops.forEach((p,i)=>{
    const el=document.createElement('div'); el.className='pop'; el.id='p'+i;
    el.style.width=cardW+'px'; el.style.top=top+'px';
    if(shorts){el.style.left=side+'px';el.style.transformOrigin='0 0';}
    else{el.style.right=side+'px';el.style.transformOrigin='100% 0';}
    const portrait=p.kind==='person';
    const imgH=Math.round(cardW*(portrait?(shorts?1.17:0.95):0.77));
    el.innerHTML=`<img src="${p.image}" style="height:${imgH}px;object-position:${p.focus||'50% 25%'}">
      <p class="name" style="font-size:${Math.round(cardW*0.077)}px">${p.name}<span class="sub" style="font-size:${Math.round(cardW*0.065)}px">${p.sub||''}</span></p>`;
    box.appendChild(el);
  });
};
window.setTime=function(t){
  const c=(CFG.captions||[]).find(c=>t>=c.start&&t<c.end);
  document.getElementById('cap').innerHTML=c?c.text:'';
  CFG.pops.forEach((p,i)=>{
    const el=document.getElementById('p'+i), IN=.25, OUT=.2, s=p.start, e=p.end;
    let sc=0,op=0;
    if(t>=s&&t<s+IN){const k=(t-s)/IN;sc=.5+.5*back(k);op=ease(k)}
    else if(t>=s+IN&&t<e){sc=1;op=1}
    else if(t>=e&&t<e+OUT){const k=(t-e)/OUT;sc=1-.3*k;op=1-k}
    el.style.opacity=op; el.style.transform=`scale(${sc})`;
  });
};
</script></body></html>
