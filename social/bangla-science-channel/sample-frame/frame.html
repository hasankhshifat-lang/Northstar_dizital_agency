<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Baloo;src:url(fonts/baloo-da-2-bengali-800-normal.woff2);font-weight:800}
@font-face{font-family:Baloo;src:url(fonts/baloo-da-2-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:Atma;src:url(fonts/atma-bengali-600-normal.woff2);font-weight:600}
@font-face{font-family:Atma;src:url(fonts/atma-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:Hind;src:url(fonts/hind-siliguri-bengali-700-normal.woff2);font-weight:700}
@font-face{font-family:Hind;src:url(fonts/hind-siliguri-latin-700-normal.woff2);font-weight:700}
:root{--red:#D7263D;--pink:#F72585;--teal:#00A6A6;--yel:#FFC300;--grn:#2BA84A;--sky:#4CC9F0;--ink:#1A1A1A;--paper:#FFF6E5;--pencil:#2B4C8C}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1920px;background:var(--teal);position:relative;overflow:hidden;font-family:Hind}
/* rickshaw-style patterned backdrop */
.bg{position:absolute;inset:0;background:
 radial-gradient(circle at 20px 20px,var(--yel) 7px,transparent 8px) 0 0/80px 80px,
 radial-gradient(circle at 60px 60px,var(--pink) 7px,transparent 8px) 0 0/80px 80px,var(--teal)}
/* title plate */
.plate{position:absolute;top:34px;left:50%;transform:translateX(-50%) rotate(-1.5deg);width:760px;height:150px;
 background:var(--red);border:7px solid var(--ink);border-radius:40px 40px 70px 70px/40px 40px 90px 90px;
 box-shadow:0 10px 0 var(--ink);display:flex;align-items:center;justify-content:center;gap:26px}
.plate h1{font-family:Baloo;font-weight:800;font-size:88px;line-height:1;color:var(--yel);padding-top:14px;
 -webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 var(--ink)}
.flower{width:64px;height:64px}
/* story panel */
.story{position:absolute;top:212px;left:36px;width:1008px;height:900px;border:8px solid var(--ink);border-radius:28px;overflow:hidden;background:#fff}
.story img{width:100%;height:100%;object-fit:cover;object-position:center 60%}
.bubble{position:absolute;top:250px;left:420px;background:#fff;border:6px solid var(--ink);border-radius:46px;padding:18px 30px 10px;
 font-family:Hind;font-weight:700;font-size:44px;color:var(--ink);box-shadow:6px 6px 0 var(--ink);max-width:560px;line-height:1.25}
.bubble:after{content:"";position:absolute;bottom:-34px;left:110px;border:18px solid transparent;border-top:22px solid var(--ink)}
.sfx{position:absolute;top:385px;left:735px;font-family:Baloo;font-weight:800;font-size:96px;color:var(--yel);transform:rotate(-12deg);
 -webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:6px 6px 0 var(--pink)}
/* floral divider */
.divider{position:absolute;top:1122px;left:0;width:1080px;height:46px;display:flex;justify-content:center;gap:10px}
.divider svg{width:46px;height:46px}
/* notebook panel */
.note{position:absolute;top:1178px;left:36px;width:1008px;height:420px;background:
 linear-gradient(90deg,transparent 104px,#E8A0A8 104px,#E8A0A8 108px,transparent 108px),
 repeating-linear-gradient(180deg,var(--paper) 0,var(--paper) 63px,#B9D3E8 63px,#B9D3E8 66px);
 border:8px solid var(--ink);border-radius:22px;box-shadow:0 10px 0 var(--ink);overflow:hidden}
.note .h{position:absolute;top:14px;left:132px;font-family:Atma;font-weight:600;font-size:52px;color:var(--red)}
.note .rows{position:absolute;top:96px;left:132px;right:30px;display:flex;gap:34px}
.col{flex:1;text-align:center;font-family:Atma;font-weight:600;color:var(--pencil);font-size:38px;line-height:1.3}
.col svg{display:block;margin:0 auto 4px}
.res{display:inline-block;margin-top:6px;padding:2px 22px 0;border:4px solid var(--teal);border-radius:30px;color:var(--teal);font-size:40px}
.res.sink{border-color:var(--red);color:var(--red)}
.logo{position:absolute;right:22px;bottom:18px;width:88px;height:88px}
/* safe zone marker (for review only) */
.safe{position:absolute;left:0;right:0;bottom:0;height:300px;}
.subtitle{position:absolute;top:1024px;left:50%;transform:translateX(-50%);white-space:nowrap;text-align:center;font-family:Hind;font-weight:700;font-size:44px;line-height:1.25;color:#fff;
 background:rgba(26,26,26,.82);border:4px solid var(--yel);border-radius:40px;padding:12px 34px 6px}
</style></head><body>

 </div>

  <rect x="34" y="14" width="20" height="50" rx="10" fill="#fff" stroke="#1A1A1A" stroke-width="4"/>
