</div>
<script>
const D = __DATA__;
const $ = id => document.getElementById(id);
const FPS = 24; let FR = 0;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2};
const back=x=>{x=clamp(x);const c1=1.7,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
const stp=(x,n)=>ease(clamp(x));
function rnd(s){const x=Math.sin(s*12.9898)*43758.5453;return x-Math.floor(x);}
const J=(k,a)=>0;
const INK="#1A1A1A";
// ---------- characters ----------
const SIZE={mama:[520,1060],tuni:[420,1060],boltu:[360,920]}, KEY={mama:"Montu Mama",tuni:"Bithi",boltu:"Boltu"}, FIT={mama:0.74,tuni:0.72,boltu:0.72};
const LIPENV=D.mouth;

function buildChar(el,c){
  el.style.width=SIZE[c][0]+"px"; el.style.height=SIZE[c][1]+"px";
  el.innerHTML = D.chars[KEY[c]];
  el.dataset.c = c; el.dataset.mood = "Default";
}

function getRig(el){
  if(el._rig) return el._rig;
  const q = s => el.querySelector(s);
  const getPivot = node => node && node.dataset.p ? node.dataset.p.split(",").map(Number) : [0,0];
  const getCenter = node => {
    if(!node) return [0,0];
    try { const b = node.getBBox(); return [b.x + b.width/2, b.y + b.height/2]; }
    catch(e){ return [0,0]; }
  };
  const r = {
    head: q("g.head"), headP: getPivot(q("g.head")),
    armL: q("g.armL"), armLP: getPivot(q("g.armL")),
    armR: q("g.armR"), armRP: getPivot(q("g.armR")),
    foreL: q("g.foreL"), foreLP: getPivot(q("g.foreL")),
    foreR: q("g.foreR"), foreRP: getPivot(q("g.foreR")),
    handLRelax: q("g.armL g.handRelax"), handLOpen: q("g.armL g.handOpen"),
    handRRelax: q("g.armR g.handRelax"), handROpen: q("g.armR g.handOpen"),
    eyesOpen: q("g.eyes-open"), eyesClosed: q("g.eyes-closed"),
    brows: q("g.brows"), browL: q("g.browL"), browR: q("g.browR"),
    browLCenter: null, browRCenter: null,
    face: q("g.face"), hairF: q("g.hairF"), earL: q("g.earL"), earR: q("g.earR"),
    mouths: {
      rest: q("g.mouths > g.m-rest"),
      a: q("g.mouths > g.m-a"),
      e: q("g.mouths > g.m-e"),
      o: q("g.mouths > g.m-o"),
      smile: q("g.mouths > g.m-smile")
    }
  };
  el._rig = r;
  return r;
}

for(const c of ["mama","tuni","boltu"]) buildChar($(c),c);
buildChar($("tuniMini"),"tuni"); buildChar($("boltuMini"),"boltu"); buildChar($("mamaMini"),"mama");

function setExpr(el,e){ el.dataset.mood = e; }

function place(id,c,x,y,s,r=0){
  const el=$(id); el.style.display="block";
  el.dataset.x = x;
  el.style.left=(x-SIZE[c][0]/2)+"px"; el.style.top=(y-SIZE[c][1])+"px";
  el.style.transform=`scale(${s*FIT[c]}) rotate(${r}deg)`;
}

function rig(id,aL,aR,hd){
  const el=$(id), r=getRig(el);
  if(r.head) r.head.setAttribute("transform",`rotate(${hd.toFixed(1)} ${r.headP[0]} ${r.headP[1]})`);
  if(r.armL) r.armL.setAttribute("transform",`rotate(${aL.toFixed(1)} ${r.armLP[0]} ${r.armLP[1]})`);
  if(r.armR) r.armR.setAttribute("transform",`rotate(${aR.toFixed(1)} ${r.armRP[0]} ${r.armRP[1]})`);

  // forearm bends the natural way: raised arm -> forearm turns further up toward the head; hanging arm -> slight inward bend
  const fL = aL > 25 ? Math.min(45, 0.35*aL) : -(6 + 0.08*Math.abs(aL));
  const fR = aR < -25 ? -Math.min(45, 0.35*Math.abs(aR)) : (6 + 0.08*Math.abs(aR));
  // when the arm points up, mirror the hand so the thumb stays on the inner (head) side
  const mirror = (rel, open, cx, on) => { const tf = on ? `translate(${2*cx} 0) scale(-1 1)` : ""; for (const g of [rel, open]) if (g) { if (tf) g.setAttribute("transform", tf); else g.removeAttribute("transform"); } };
  mirror(r.handLRelax, r.handLOpen, r.foreLP[0] - 4, aL + fL > 70);
  mirror(r.handRRelax, r.handROpen, r.foreRP[0] + 4, -(aR + fR) > 70);
  if(r.foreL) r.foreL.setAttribute("transform",`rotate(${fL.toFixed(1)} ${r.foreLP[0]} ${r.foreLP[1]})`);
  if(r.foreR) r.foreR.setAttribute("transform",`rotate(${fR.toFixed(1)} ${r.foreRP[0]} ${r.foreRP[1]})`);

  if(r.handLOpen && r.handLRelax){
    const openL = Math.abs(aL) > 55;
    r.handLOpen.style.display = openL ? "" : "none";
    r.handLRelax.style.display = openL ? "none" : "";
  }
  if(r.handROpen && r.handRRelax){
    const openR = Math.abs(aR) > 55;
    r.handROpen.style.display = openR ? "" : "none";
    r.handRRelax.style.display = openR ? "none" : "";
  }
}

const BLINKS = {};
function getBlinkTimes(id){
  if(BLINKS[id]) return BLINKS[id];
  const list = [];
  let idx = 0, t = 1.0;
  while(t < 130){
    const gap = 2.6 + rnd(id.length * 100 + idx) * 1.6;
    t += gap;
    list.push(t);
    idx++;
  }
  BLINKS[id] = list;
  return list;
}

function applyLips(tm){
  const groups = [
    [["mama","mama"],["tuni","tuni"],["boltu","boltu"]],
    [["mamaMini","mama"],["tuniMini","tuni"],["boltuMini","boltu"]]
  ];

  for(const group of groups){
    for(const [id,who] of group){
      const el=$(id);
      if(!el || el.style.display==="none") continue;
      const r = getRig(el);
      const mood = el.dataset.mood || "Default";
      const sp = speaking(who,tm);
      const lv = sp ? Number(LIPENV[Math.round(tm*24)]||0) : -1;

      // Mouth selection
      let mKey = "rest";
      if(lv === 0) mKey = "rest";
      else if(lv === 1) mKey = "e";
      else if(lv === 2){
        const h = rnd(Math.floor(Math.round(tm*24)/3));
        mKey = h < 0.2 ? "o" : "a";
      } else if(lv === -1){
        mKey = mood === "Happy" ? "smile" : "rest";
      }

      for(const k in r.mouths){
        if(r.mouths[k]) r.mouths[k].style.display = (k === mKey) ? "" : "none";
      }

      // Brows
      if(r.brows){
        if(!r.browLCenter && r.browL){
          try { const b = r.browL.getBBox(); r.browLCenter = [b.x + b.width/2, b.y + b.height/2]; } catch(e){ r.browLCenter=[0,0]; }
        }
        if(!r.browRCenter && r.browR){
          try { const b = r.browR.getBBox(); r.browRCenter = [b.x + b.width/2, b.y + b.height/2]; } catch(e){ r.browRCenter=[0,0]; }
        }

        if(mood === "Worried"){
          if(r.browL) r.browL.setAttribute("transform", `rotate(10 ${r.browLCenter[0]} ${r.browLCenter[1]})`);
          if(r.browR) r.browR.setAttribute("transform", `rotate(-10 ${r.browRCenter[0]} ${r.browRCenter[1]})`);
          r.brows.setAttribute("transform", lv === 2 ? "translate(0,-4)" : "");
        } else if(mood === "Happy"){
          if(r.browL) r.browL.removeAttribute("transform");
          if(r.browR) r.browR.removeAttribute("transform");
          r.brows.setAttribute("transform", "translate(0,-3)");
        } else {
          if(r.browL) r.browL.removeAttribute("transform");
          if(r.browR) r.browR.removeAttribute("transform");
          r.brows.removeAttribute("transform");
        }
      }

      // Blink
      if(r.eyesOpen && r.eyesClosed){
        const blinks = getBlinkTimes(id);
        const frameT = Math.round(tm*24)/24;
        let closed = false;
        for(const bt of blinks){
          if(frameT >= bt && frameT < bt + 3/24){ closed = true; break; }
        }
        r.eyesClosed.style.display = closed ? "" : "none";
        r.eyesOpen.style.display = closed ? "none" : "";
      }

      // Head turn
      const myX = Number(el.dataset.x || 0);
      let turnSum = 0;
      const times = [tm, tm-0.1, tm-0.2, tm-0.3];
      for(const tSample of times){
        let otherX = null;
        for(const [otherId, otherWho] of group){
          if(otherId === id) continue;
          const oEl = $(otherId);
          if(oEl && oEl.style.display !== "none" && speaking(otherWho, tSample)){
            otherX = Number(oEl.dataset.x || 0);
            break;
          }
        }
        if(otherX !== null){
          turnSum += 0.6 * Math.sign(otherX - myX);
        }
      }
      const turn = turnSum / 4;
      if(r.face) r.face.setAttribute("transform", `translate(${(turn*11).toFixed(1)},0)`);
      if(r.hairF) r.hairF.setAttribute("transform", `translate(${(turn*4).toFixed(1)},0)`);
      if(r.earR) r.earR.style.display = turn > 0.45 ? "none" : "";
      if(r.earL) r.earL.style.display = turn < -0.45 ? "none" : "";
    }
  }
}

function gest(id,who,t,base){ // base: {aL,aR,hd}; talking adds lively gestures
  const sp=speaking(who,t); let {aL,aR,hd}=base; const w=Math.sin(t*2.6), w2=Math.sin(t*1.8+1);
  if(sp){ aR += -3 - 3*w; aL += 2 + 2*w2; hd += 3*Math.sin(t*2.1); } else { aL += 2*Math.sin(t*1.7); aR += -2*Math.sin(t*1.9+1); hd += 1.2*Math.sin(t*1.3); }
  rig(id,aL,aR,hd); }
function hide(id){$(id).style.display="none";}
function speaking(who,t){return D.lines.find(l=>l.speaker===who&&t>=l.start&&t<=l.end);}
function talkExpr(who,t,open,closed){return speaking(who,t)?open:closed;}
// ---------- world props ----------
$("bgLayer").innerHTML=D.bg; $("bucket").innerHTML=D.props.bucket; $("inNail").innerHTML=D.props.nail;
$("trunk").innerHTML=`<svg viewBox="0 0 360 220" width="360" height="220"><g stroke="${INK}" stroke-width="7" stroke-linejoin="round"><rect x="10" y="40" width="340" height="170" rx="14" fill="#2E6FB5"/><rect x="10" y="40" width="340" height="50" rx="14" fill="#3D86D1"/><g fill="#FFC300"><rect x="70" y="40" width="26" height="170"/><rect x="264" y="40" width="26" height="170"/></g><rect x="150" y="70" width="60" height="40" rx="6" fill="#C9D1D6"/><path d="M130 40 Q180 0 230 40" fill="none" stroke-width="9"/><g fill="#F72585" stroke-width="3"><circle cx="180" cy="160" r="16"/></g></g></svg>`;
$("trunk").style.width="360px";$("trunk").style.height="220px";
$("bucket").style.width="220px";$("bucket").style.height="260px";
// tiffin bucket (big, with science arrows)
$("tiffinBucket").style.width="340px";$("tiffinBucket").style.height="420px";
$("tiffinBucket").innerHTML=`<svg viewBox="0 0 340 420" width="340" height="420"><g stroke="${INK}" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
 <g filter="url(#cut)"><path d="M40 170 L300 170 L276 410 L64 410 Z" fill="#7E8B94"/><ellipse cx="170" cy="172" rx="130" ry="26" fill="#4CC9F0"/></g>
 <g id="tif"><g filter="url(#cut)"><rect x="-58" y="-96" width="116" height="32" rx="10" fill="#C9D1D6"/><rect x="-58" y="-64" width="116" height="32" rx="10" fill="#DCE2E6"/><rect x="-58" y="-32" width="116" height="32" rx="10" fill="#C9D1D6"/><path d="M-40 -96 Q0 -140 40 -96" fill="none" stroke-width="7"/></g></g>
 <g id="foods"></g>
 <g filter="url(#cut)"><path d="M48 190 L292 190 L276 410 L64 410 Z" fill="#9AA7B0"/><path d="M54 250 H286 M60 320 H280" stroke-width="5"/></g>
 <g id="tifW"><path id="tifWp" fill="#D7263D"/><text id="tifWt" x="44" y="0" font-family="Hind" font-weight="700" font-size="34" fill="#A3122A" stroke="#fff" stroke-width="9" paint-order="stroke" text-anchor="middle">ওজন</text></g>
 <g id="tifB"><path id="tifBp" fill="#00A6A6"/><text x="300" y="0" id="tifBt" font-family="Hind" font-weight="700" font-size="34" fill="#006B6B" stroke="#fff" stroke-width="9" paint-order="stroke" text-anchor="middle">প্লবতা</text></g>
 <g id="tifTag"></g></g></svg>`;
// world fx (gulls, smoke, waves)
$("fx").innerHTML=`<g id="smoke"></g><g id="gulls"></g><g id="waves" stroke="#fff" stroke-width="6" fill="none" opacity=".8"></g>`;
// ---------- svg helpers ----------
const svgNS="http://www.w3.org/2000/svg";
function tag(text,fs=40,fill="#fff",color=INK,font="Hind"){ const w=text.length*fs*0.56+48, h=fs*1.55;
  return `<g filter="url(#cut)"><rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="8" fill="${fill}"/></g><text x="0" y="${fs*0.08}" text-anchor="middle" dominant-baseline="middle" font-family="${font}" font-weight="700" font-size="${fs}" fill="${color}" stroke="none">${text}</text>`; }
function g(id,inner,extra=""){return `<g id="${id}" ${extra}>${inner}</g>`;}
function setT(id,x,y,s=1,r=0,k=0){const e=$(id); if(!e)return; e.setAttribute("transform",`translate(${(x+J(k||id.length,5)).toFixed(1)} ${(y+J((k||id.length)+3,5)).toFixed(1)}) rotate(${(r+J((k||id.length)+5,1.8)).toFixed(2)}) scale(${s})`);}
function vis(id,on){const e=$(id); if(e) e.style.display=on?"":"none";}
function arrowPath(x,y0,y1,w=22){ // vertical arrow from y0 to y1 (tip at y1)
  const dir=y1<y0?-1:1, L=Math.abs(y1-y0), hw=w*1.6, hl=Math.min(46,L*0.5);
  const yb=y1-dir*hl; return `M${x-w/2} ${y0} L${x+w/2} ${y0} L${x+w/2} ${yb} L${x+hw} ${yb} L${x} ${y1} L${x-hw} ${yb} L${x-w/2} ${yb} Z`; }
function pop(t,t0){return 0.25+0.75*back(stp((t-t0)/0.35,4));}
// launch shape (local coords, waterline y=0)
const HULL="M-400 -150 L400 -150 L360 60 Q0 150 -360 60 Z", INNER="M-372 -134 L372 -134 L338 48 Q0 128 -338 48 Z", UNDER="M-388 0 L388 0 L360 60 Q0 150 -360 60 Z";
const CABIN=`<rect x="-250" y="-262" width="500" height="112" fill="#00A6A6"/>${[...Array(6).keys()].map(i=>`<rect x="${-220+i*76}" y="-236" width="48" height="48" rx="8" fill="#4CC9F0"/>`).join("")}<rect x="140" y="-340" width="50" height="78" fill="#D7263D"/><rect x="140" y="-340" width="50" height="18" fill="${INK}"/>`;
function launchSolid(scale=1){return `<g transform="scale(${scale})" stroke="${INK}" stroke-width="7" stroke-linejoin="round"><g filter="url(#cut)">${CABIN}<path d="${HULL}" fill="#D7263D"/><rect x="-380" y="-110" width="760" height="18" fill="#FFC300"/></g></g>`;}
function nailShape(){return `<g stroke="${INK}" stroke-width="6" stroke-linejoin="round" filter="url(#cut)"><rect x="-34" y="-150" width="68" height="22" rx="6" fill="#8E9AA3"/><path d="M-14 -128 L14 -128 L10 90 L0 130 L-10 90 Z" fill="url(#hatchG)"/></g>`;}
// ---------- BOARDS (all in one svg, groups toggled) ----------
const B = $("bsvg");
const tape=(x,y,r)=>`<rect x="${x-60}" y="${y-18}" width="120" height="36" fill="#F3E6B3" opacity=".85" transform="rotate(${r} ${x} ${y})"/>`;
B.innerHTML = `<g id="bcam"><g id="backdrops"></g>
<g id="kraftDeco"><g opacity=".18" stroke="#6b4a1f" stroke-width="2" fill="none">${[...Array(40).keys()].map(i=>`<path d="M0 ${i*48+10} q270 ${(i%3-1)*8} 540 0 t540 0"/>`).join("")}</g></g>
<g id="bQ" stroke="${INK}" stroke-linejoin="round">
 <g id="qc1"><g filter="url(#cut)"><rect x="-220" y="-120" width="440" height="240" rx="10" fill="#FFF9EC" stroke-width="5"/></g><g transform="translate(-130 30) scale(.55)">${nailShape()}</g>
  <text x="50" y="-30" text-anchor="middle" font-family="Baloo" font-size="44" fill="${INK}" stroke="none">লোহার পেরেক</text><path d="M50 10 V70" stroke="#D7263D" stroke-width="14"/><path d="M20 50 L50 90 L80 50" fill="none" stroke="#D7263D" stroke-width="14"/>

// The camera fits the box inside the safe area (edges, presenter, YouTube overlay) and glides 0.9 s between keys.
const SAFE={x0:70,y0:150,x1:1010,y1:1270};
const CAM = {
 6: [[34.6,290,480,890,870],[37.55,200,760,990,1465],[39.45,195,870,575,1465],[40.85,600,870,990,1465],[42.55,10,880,1000,1470],[44.95,10,440,1000,1470]],
 7: [[47.3,140,330,980,880],[50.7,140,330,980,1045],[53.4,140,380,1000,1045],[55.15,100,820,1020,1480],[59.55,60,240,1035,1480],[60.9,60,460,1000,965],[62.95,100,620,1020,1480],[65.6,500,540,1010,1330]],
 8: [[67.2,90,420,1000,770]],
 10:[[80.7,40,410,1040,1260],[81.4,170,540,950,1010],[83.4,680,430,1035,680],[84.9,40,520,1040,1265],[87.2,40,400,1040,1260]],
 12:[[95.8,40,450,1040,1360],[101.7,210,490,1000,1250]],
};
function boxPose(b){ const w=b[3]-b[1], h=b[4]-b[2]; let z=Math.min((SAFE.x1-SAFE.x0)/w,(SAFE.y1-SAFE.y0)/h); z=clamp(z,1,1.8);
  return [(b[1]+b[3])/2,(b[2]+b[4])/2,z]; }
function camPose(keys,t){ let i=0; while(i<keys.length-1 && t>=keys[i+1][0]) i++;
  const cur=boxPose(keys[i]), prev=boxPose(keys[Math.max(0,i-1)]), k=i===0?1:ease((t-keys[i][0])/0.9);
  return [lerp(prev[0],cur[0],k), lerp(prev[1],cur[1],k), lerp(prev[2],cur[2],k)]; }
function setCam(cx,cy,z){ const Sx=(SAFE.x0+SAFE.x1)/2, Sy=(SAFE.y0+SAFE.y1)/2;
