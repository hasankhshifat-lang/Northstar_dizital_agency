<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<style>
.stage{width:1080px;height:1350px;padding:72px 80px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;position:relative}
.tag{font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:var(--t2)}
main{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;gap:40px}
h1{font-size:92px;line-height:1.02;letter-spacing:-.03em;font-weight:600}
.sub{font-size:36px;line-height:1.4;color:var(--t2);max-width:880px}
ul{list-style:none;display:grid;gap:18px;padding:34px 40px}
li{font-size:34px;display:flex;gap:22px;align-items:flex-start;line-height:1.3}
li:before{content:"✓";color:var(--p);font-weight:700;flex:none}
.foot{position:relative;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--bd);padding-top:36px}
.contact{font-size:28px;color:var(--t2);line-height:1.5;text-align:right}
.contact b{color:var(--tx);font-weight:500}
</style></head>
<body><div class="stage" id="s">
<div class="glow g1" style="width:620px;height:620px;left:-200px;top:-160px"></div>
<div class="glow g2" style="width:520px;height:520px;right:-220px;top:380px"></div>
<div class="glow g3" style="width:460px;height:460px;left:180px;bottom:-300px;opacity:.3"></div>
<div class="grid-bg"></div>
<div class="top"><img class="logo" src="../../../assets/logo.png" alt=""><span class="tag" id="tag"></span></div>
<main>
  <span class="kicker" id="kicker"></span>
  <h1 id="h"></h1>
  <p class="sub" id="sub"></p>
  <ul class="glass" id="pts"></ul>
</main>
<div class="foot"><span class="chip" id="chip"></span><div class="contact" id="contact"></div></div>
</div>
<script>
// Post data is injected by render.js as window.POST before this runs.
const P = window.POST || {};
const hl = s => (s||'').replace(/\*(.+?)\*/g,'<span class="gt">$1</span>');
const set = (id, v, html) => { const el = document.getElementById(id); if (!v) { el.remove(); return; } html ? el.innerHTML = v : el.textContent = v; };
set('tag', P.tag);
set('kicker', P.kicker);
set('h', hl(P.headline), true);
set('sub', P.sub);
set('pts', (P.points||[]).map(p => `<li>${p}</li>`).join(''), true);
set('chip', P.chip);
set('contact', P.contact || '<b>WhatsApp +880 1872-692783</b><br>samplewebsite.tech', true);
</script>
</body></html>
