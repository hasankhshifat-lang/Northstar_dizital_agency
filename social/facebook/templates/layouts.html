<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css">
<style>
/* Eight distinct 1080x1080 ad layouts modelled on the owner's reference ads and Bangla
   typography posts. Pick with design.layout; colours with design.palette. */
.stage{width:1080px;height:1080px;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Hind Siliguri'}
.p-purple{--bg:linear-gradient(160deg,#FBF8FF,#E9DDFF);--ink:#1E1240;--box:#6A2BE2;--boxink:#fff;--acc:#FF7A1A;--accink:#fff;--bar:#6A2BE2;--barink:#fff;--glow:#B28CFF;--deep:#2A0E5C}
.p-orange{--bg:linear-gradient(160deg,#FF7A1A,#FF5A1F);--ink:#fff;--box:#fff;--boxink:#FF5A1F;--acc:#FFE14D;--accink:#1A1A1A;--bar:#1A1A1A;--barink:#fff;--glow:#FFC08A;--deep:#7A2400}
.p-green{--bg:linear-gradient(160deg,#FFFFFF,#E3FBEC);--ink:#0F2A1C;--box:#0FA958;--boxink:#fff;--acc:#0FA958;--accink:#fff;--bar:#0B6B3A;--barink:#fff;--glow:#7CE7A8;--deep:#0B3D22}
.p-blue{--bg:linear-gradient(160deg,#0A2FB8,#1E6BFF);--ink:#fff;--box:#FFE14D;--boxink:#0A2FB8;--acc:#7CF6FF;--accink:#071F3A;--bar:#071F7A;--barink:#fff;--glow:#5FA8FF;--deep:#041A66}
.p-yellow{--bg:linear-gradient(160deg,#FFD84D,#FFB800);--ink:#16130A;--box:#1D4ED8;--boxink:#fff;--acc:#E11D48;--accink:#fff;--bar:#16130A;--barink:#FFD84D;--glow:#FFF1A8;--deep:#5A3A00}
.p-night{--bg:radial-gradient(circle at 70% 30%,#3B1C8C 0,#160A3A 60%);--ink:#fff;--box:#FF3D7F;--boxink:#fff;--acc:#FFD23F;--accink:#160A3A;--bar:#FF3D7F;--barink:#fff;--glow:#7B5CFF;--deep:#0B0520}

.glow{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;background:var(--glow);z-index:0}
.logo{position:absolute;left:52px;top:44px;height:38px;z-index:8}
.p-purple .logo,.p-green .logo,.p-yellow .logo{filter:brightness(0)}
.p-orange .logo,.p-blue .logo,.p-night .logo{filter:brightness(0) invert(1)}
.person{position:absolute;z-index:3;filter:drop-shadow(0 30px 40px rgba(0,0,0,.25))}
.emo{position:absolute;z-index:4;font-family:'Noto Color Emoji';filter:drop-shadow(0 12px 18px rgba(0,0,0,.25))}
.emo.blur{filter:blur(5px);opacity:.75}

/* type helpers */
.t{font-family:'Mina';font-weight:700;line-height:1.16;white-space:nowrap}
.baloo{font-family:'Baloo Da 2';font-weight:800}
.anek{font-family:'Anek Bangla';font-weight:800;font-stretch:85%}
.galada{font-family:'Galada';font-weight:400}
.box{display:inline-block;background:var(--box);color:var(--boxink);padding:0 24px 8px;border-radius:14px}
.ribbon{display:inline-block;background:var(--acc);color:var(--accink);padding:2px 26px 8px;transform:skewX(-8deg)}
.acc{color:var(--acc)}
.outline{color:transparent;-webkit-text-stroke:3px currentColor}
.hl{color:var(--acc)}

/* phone + chat */
.phone{position:absolute;z-index:4;width:300px;height:560px;border-radius:48px;background:#0E0E1A;padding:11px;box-shadow:0 40px 70px rgba(10,5,40,.35)}
.scr{width:100%;height:100%;border-radius:38px;background:#F2F3F7;overflow:hidden;display:flex;flex-direction:column}
.bar{background:#fff;padding:24px 16px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #e3e5ec}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#4D6BFE,#C13BFF);display:grid;place-items:center;font:700 16px 'Space Grotesk';color:#fff}
.bar b{display:block;font-size:19px;color:#111}.bar small{font-size:14px;color:#1DB954}
.msgs{flex:1;padding:14px 12px;display:flex;flex-direction:column;gap:9px;justify-content:flex-end}
.m{max-width:88%;padding:9px 13px;border-radius:18px;font-size:19px;line-height:1.3;color:#111;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.06)}
.m.me{align-self:flex-end;background:#4D6BFE;color:#fff;border-bottom-right-radius:6px}.m.ai{border-bottom-left-radius:6px}
.m i{display:block;font-style:normal;font:500 12px 'Space Grotesk';opacity:.6;margin-top:3px}
/* glass card */
.card{position:absolute;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 18px;border-radius:20px;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border:1.5px solid rgba(255,255,255,.9);box-shadow:0 18px 36px rgba(20,10,60,.18);font:700 24px 'Hind Siliguri';color:#1E1240;white-space:nowrap}
.card .ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:25px;font-family:'Noto Color Emoji';background:#EEF2FF}
.card small{display:block;font:500 16px 'Hind Siliguri';color:#6b6680}
/* bottom bar */
.foot{position:absolute;left:0;right:0;bottom:0;height:84px;z-index:9;background:var(--bar);color:var(--barink);display:flex;align-items:center;justify-content:space-between;padding:0 44px 0 0}
.foot .cta{height:100%;display:flex;align-items:center;padding:0 34px 0 44px;background:var(--acc);color:var(--accink);font:700 29px 'Hind Siliguri';clip-path:polygon(0 0,100% 0,92% 100%,0 100%)}
.foot .wa{display:flex;align-items:center;gap:12px;font:600 29px 'Space Grotesk'}
.foot .wa svg{width:34px;height:34px}
.foot .web{font:500 25px 'Space Grotesk';opacity:.9}

/* ---------- L1 split: text + feature box left, big phone right (GrowUS FB page) ---------- */
.L-split .txt{position:absolute;left:56px;top:150px;width:560px;z-index:5}
.L-split .t1{font-size:96px;color:var(--box)}
.L-split .t2{font-size:64px;margin:6px 0}
.L-split .t3{font-size:78px}
.L-split .dash{margin-top:36px;border:3px dashed var(--acc);border-radius:16px;padding:20px 24px;font:500 29px/1.5 'Hind Siliguri'}
.L-split .phone{right:70px;top:190px;width:340px;height:660px;transform:rotate(4deg)}
.L-split .sub2{margin-top:26px;font:700 32px 'Hind Siliguri';color:var(--box)}

/* ---------- L2 hero: person centre, headline across top ---------- */
.L-hero .head{position:absolute;top:110px;left:0;right:0;text-align:center;z-index:6}
.L-hero .h1{font-size:62px}
.L-hero .h2{font-size:122px;line-height:1.05;color:var(--acc);text-shadow:0 6px 0 var(--deep)}
.L-hero .h3{font-size:56px}
.L-hero .person{left:50%;transform:translateX(-50%);bottom:84px;height:600px}
.L-hero .pin{position:absolute;z-index:4;width:66px;height:84px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--box);box-shadow:0 10px 20px rgba(0,0,0,.25)}
.L-hero .pin:after{content:"";position:absolute;inset:18px;border-radius:50%;background:#fff}

/* ---------- L3 glass: person + glowing glass panels and curves (PayU / GrowUS lifestyle) ---------- */
.L-glass .head{position:absolute;top:118px;left:56px;right:56px;z-index:6;text-align:center}
.L-glass .h1{font-size:60px}.L-glass .h2{font-size:76px}
.L-glass .person{left:50%;transform:translateX(-50%);bottom:84px;height:620px}
.L-glass .pane{position:absolute;z-index:4;border-radius:28px;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.55);backdrop-filter:blur(10px);box-shadow:0 0 40px rgba(124,246,255,.35),inset 0 0 20px rgba(255,255,255,.2);color:#fff;padding:16px 20px;font:700 24px 'Hind Siliguri'}
.L-glass .pane small{display:block;font:500 17px 'Hind Siliguri';opacity:.8}
.L-glass .pane .ic{font-family:'Noto Color Emoji';font-size:34px;display:block;margin-bottom:4px}
.L-glass svg.curves{position:absolute;inset:0;z-index:3}

/* ---------- L4 trio: three phones fanned, person in front (Guptodhon) ---------- */
.L-trio .head{position:absolute;top:104px;left:0;right:0;text-align:center;z-index:6}
.L-trio .h1{font-size:60px}.L-trio .h2{font-size:92px}
.L-trio .phone{top:330px;width:270px;height:520px}
.L-trio .person{left:50%;transform:translateX(-50%);bottom:84px;height:560px;z-index:6}

/* ---------- L5 laptop: browser/dashboard mockup hero (Moasa, GrowUS CPR) ---------- */
.L-laptop .head{position:absolute;top:104px;left:0;right:0;text-align:center;z-index:6}
.L-laptop .h1{font-size:96px;transform:rotate(-3deg)}.L-laptop .h2{font-size:56px;margin-top:4px}
.L-laptop .lap{position:absolute;left:150px;top:390px;width:780px;z-index:4;transform:perspective(1400px) rotateX(8deg)}
.L-laptop .screen{background:#0E0E1A;border-radius:22px 22px 0 0;padding:14px}
.L-laptop .dash{background:#F6F7FB;border-radius:10px;height:400px;display:grid;grid-template-columns:200px 1fr;overflow:hidden}
.L-laptop .side{background:#1E1240;color:#fff;padding:18px;font:600 17px 'Hind Siliguri';display:grid;gap:12px;align-content:start}
.L-laptop .side b{font:700 19px 'Space Grotesk'}
.L-laptop .main{padding:18px;display:grid;gap:12px;align-content:start}
.L-laptop .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.L-laptop .kpi{background:#fff;border-radius:12px;padding:12px;font:600 15px 'Hind Siliguri';color:#666;box-shadow:0 4px 10px rgba(0,0,0,.05)}
.L-laptop .kpi b{display:block;font:700 26px 'Space Grotesk';color:#1E1240}
.L-laptop .row{background:#fff;border-radius:12px;padding:10px 14px;font:500 16px 'Hind Siliguri';color:#333;display:flex;justify-content:space-between;box-shadow:0 4px 10px rgba(0,0,0,.05)}
.L-laptop .row em{font-style:normal;color:#0FA958;font-weight:700}
.L-laptop .base{height:26px;background:linear-gradient(#cfd2da,#a9adb8);border-radius:0 0 30px 30px;margin:0 -50px}
.L-laptop .chipicon{position:absolute;z-index:5;width:96px;height:96px;border-radius:24px;background:#fff;display:grid;place-items:center;font-family:'Noto Color Emoji';font-size:52px;box-shadow:0 16px 30px rgba(0,0,0,.18)}

/* ---------- L6 question: "AI কি...?" hook with robot (LS Software) ---------- */
.L-question .head{position:absolute;top:120px;left:56px;z-index:6;width:620px}
.L-question .q1{font-size:58px}.L-question .q2{font-size:104px;color:var(--acc)}.L-question .q3{font-size:54px}
.L-question .q4{font-size:72px}
.L-question .person{right:-10px;bottom:84px;height:560px}
.L-question .robot{position:absolute;z-index:5;font-family:'Noto Color Emoji';font-size:170px;right:330px;top:470px;filter:drop-shadow(0 20px 30px rgba(0,0,0,.25))}
.L-question .code{position:absolute;z-index:2;left:56px;bottom:120px;width:560px;font:500 20px/1.6 'Space Grotesk';opacity:.35;white-space:pre}

/* ---------- L7 bignum: giant number/keyword as hero (Renix 10%, Brand Boosters ফ্রি) ---------- */
.L-bignum .lead{position:absolute;top:130px;left:56px;z-index:6;font-size:58px}
.L-bignum .num{position:absolute;left:30px;top:190px;z-index:4;font-family:'Baloo Da 2';font-weight:800;font-size:330px;line-height:1;color:var(--box);text-shadow:10px 10px 0 var(--acc)}
.L-bignum .num small{font-size:120px}
.L-bignum .tail{position:absolute;left:56px;top:540px;z-index:6;font-size:54px;width:640px;white-space:normal}
.L-bignum .note{position:absolute;left:56px;top:830px;z-index:6;font:600 30px 'Hind Siliguri';opacity:.85;width:520px}
.L-bignum .person{right:0;bottom:84px;height:640px}

/* ---------- L8 sketch: line-art city background, relaxed person (Brand Boosters) ---------- */
.L-sketch{background:linear-gradient(180deg,#FFFDF6 0%,#FFFDF6 55%,var(--fade) 100%)!important}
.L-sketch.p-yellow{--fade:#FFE27A}.L-sketch.p-purple{--fade:#E3D3FF}.L-sketch.p-green{--fade:#C9F5DA}.L-sketch.p-orange{--fade:#FFD1AE}.L-sketch.p-blue{--fade:#CFE0FF}.L-sketch.p-night{--fade:#E3D3FF}
.L-sketch{--ink:#1A1A2E!important}
.L-sketch svg.city{position:absolute;left:0;right:0;top:260px;width:1080px;height:600px;z-index:1;opacity:.55}
.L-sketch .head{position:absolute;top:110px;left:0;right:0;text-align:center;z-index:6;color:#1A1A2E}
.L-sketch .h1{font-size:84px}.L-sketch .h2{font-size:40px;margin-top:8px;font-family:'Hind Siliguri';font-weight:600}
.L-sketch .big{position:absolute;z-index:2;left:50%;top:330px;transform:translateX(-50%);font-family:'Baloo Da 2';font-weight:800;font-size:300px;color:var(--box);opacity:.95;line-height:1}
.L-sketch .person{left:50%;transform:translateX(-50%);bottom:84px;height:560px;z-index:5}
.L-sketch .foot{background:#fff;color:#1A1A2E;border-top:2px solid #eee}
</style></head>
<body><div class="stage" id="s"></div>
<script>
const P = window.POST || {};
const L = P.layout || 'split';
const s = document.getElementById('s');
s.className = `stage p-${P.palette || 'purple'} L-${L}`;
const hl = t => (t || '').replace(/\*(.+?)\*/g, '<span class="hl">$1</span>').replace(/\[(.+?)\]/g, '<span class="box">$1</span>').replace(/\{(.+?)\}/g, '<span class="ribbon">$1</span>');
const at = ([x, y], extra = '') => `left:${x}px;top:${y}px;${extra}`;
const ROOT = '../../../';
const wa = '<svg viewBox="0 0 32 32"><path fill="#25D366" d="M16 3a13 13 0 0 0-11.2 19.6L3 29l6.6-1.7A13 13 0 1 0 16 3z"/><path fill="#fff" d="M23 19.3c-.4-.2-2.3-1.1-2.6-1.2-.4-.1-.6-.2-.9.2l-1.2 1.5c-.2.2-.4.3-.8.1a10.6 10.6 0 0 1-5.3-4.6c-.4-.7.4-.6 1.1-2.1.1-.2 0-.5 0-.7l-1.2-2.8c-.3-.7-.6-.6-.9-.6h-.7a1.4 1.4 0 0 0-1 .5 4.2 4.2 0 0 0-1.3 3.1 7.3 7.3 0 0 0 1.5 3.9 16.7 16.7 0 0 0 6.4 5.6c2.4 1 3.3 1.1 4.5.9a3.8 3.8 0 0 0 2.5-1.8 3.1 3.1 0 0 0 .2-1.8c-.1-.1-.3-.2-.6-.3z"/></svg>';
const phone = (ph, style = '') => `<div class="phone" style="${style}"><div class="scr">
  <div class="bar"><span class="av">${ph.initials || 'AI'}</span><div><b>${ph.name || 'আপনার Business'}</b><small>● AI Assistant · Active now</small></div></div>
  <div class="msgs">${(ph.messages || []).map(m => `<div class="m ${m.from}">${m.text}<i>${m.time || ''}</i></div>`).join('')}</div></div></div>`;
const cards = () => (P.cards || []).map(c => `<div class="card" style="${at(c.pos, `transform:rotate(${c.rotate || 0}deg)`)}"><span class="ic">${c.icon}</span><div>${c.text}${c.small ? `<small>${c.small}</small>` : ''}</div></div>`).join('');
const emoji = () => (P.emoji || []).map(e => `<span class="emo ${e.blur ? 'blur' : ''}" style="${at(e.pos, `font-size:${e.size || 80}px;transform:rotate(${e.rotate || 0}deg)`)}">${e.e}</span>`).join('');
const person = (style = '') => P.person ? `<img class="person" src="${ROOT}${P.person}" style="${style}">` : '';
const H = P.head || [];   // headline lines, each {t, cls}
const line = (i, cls) => H[i] ? `<div class="t ${cls} ${H[i].cls || ''}">${hl(H[i].t)}</div>` : '';
const glows = '<div class="glow" style="width:520px;height:520px;left:-120px;top:420px"></div><div class="glow" style="width:460px;height:460px;right:-140px;top:120px"></div>';

const LAYOUTS = {
  split: () => glows + `<div class="txt">${line(0, 't1')}${line(1, 't2')}${line(2, 't3')}
      ${P.box ? `<div class="dash">${P.box}</div>` : ''}${P.sub ? `<div class="sub2">${P.sub}</div>` : ''}</div>
    ${phone(P.phone || {})}${cards()}${emoji()}`,
  hero: () => glows + `<div class="head">${line(0, 'h1')}${line(1, 'h2 baloo')}${line(2, 'h3')}</div>
    ${(P.pins || []).map(p => `<span class="pin" style="${at(p)}"></span>`).join('')}
    ${person()}${cards()}${emoji()}`,
  glass: () => glows + `<svg class="curves" viewBox="0 0 1080 1080"><path d="M80 760 C300 520 760 900 1000 560" stroke="rgba(124,246,255,.6)" stroke-width="4" fill="none" stroke-dasharray="2 14" stroke-linecap="round"/><path d="M60 520 C320 400 700 700 1040 380" stroke="rgba(255,210,63,.55)" stroke-width="3" fill="none"/></svg>
    <div class="head">${line(0, 'h1')}${line(1, 'h2')}</div>
    ${(P.panes || []).map(p => `<div class="pane" style="${at(p.pos, `transform:rotate(${p.rotate || 0}deg)`)}"><span class="ic">${p.icon}</span>${p.text}${p.small ? `<small>${p.small}</small>` : ''}</div>`).join('')}
    ${person()}${emoji()}`,
  trio: () => glows + `<div class="head">${line(0, 'h1')}${line(1, 'h2')}</div>
    ${(P.phones || []).map((ph, i) => phone(ph, `left:${[90, 405, 720][i]}px;transform:rotate(${[-10, 0, 10][i]}deg) translateY(${[40, 0, 40][i]}px);`)).join('')}
    ${person()}${cards()}${emoji()}`,
  laptop: () => glows + `<div class="head">${line(0, 'h1 baloo')}${line(1, 'h2')}</div>
    <div class="lap"><div class="screen"><div class="dash">
      <div class="side"><b>AI Receptionist</b>${(P.side || ['Inbox', 'Orders', 'Bookings', 'Calls', 'Reports']).map(x => `<span>${x}</span>`).join('')}</div>
      <div class="main"><div class="kpis">${(P.kpis || []).map(k => `<div class="kpi">${k[0]}<b>${k[1]}</b></div>`).join('')}</div>
      ${(P.rows || []).map(r => `<div class="row"><span>${r[0]}</span><em>${r[1]}</em></div>`).join('')}</div>
    </div></div><div class="base"></div></div>
    ${(P.icons || []).map(i => `<span class="chipicon" style="${at(i.pos, `transform:rotate(${i.rotate || 0}deg)`)}">${i.e}</span>`).join('')}${cards()}${emoji()}`,
  question: () => glows + `<div class="code">${P.code || ''}</div><div class="head">${line(0, 'q1')}${line(1, 'q2 baloo')}${line(2, 'q3')}${line(3, 'q4')}</div>
    <span class="robot">🤖</span>${person()}${cards()}${emoji()}`,
  bignum: () => glows + `${line(0, 'lead')}<div class="num">${P.big || '২৪/৭'}</div>
    ${H[1] ? `<div class="t tail">${hl(H[1].t)}</div>` : ''}${P.sub ? `<div class="note">${P.sub}</div>` : ''}
    ${person()}${cards()}${emoji()}`,
  sketch: () => `<svg class="city" viewBox="0 0 1080 600" fill="none" stroke="#2a2a3a" stroke-width="2">
      <path d="M0 520 H1080"/>${[[20,260,120],[150,200,90],[250,300,140],[400,180,110],[520,240,130],[660,160,100],[770,280,140],[920,210,130]].map(([x,y,w]) => `<rect x="${x}" y="${y}" width="${w}" height="${520-y}"/>` + Array.from({length: Math.floor((520-y)/50)}, (_, r) => Array.from({length: Math.floor(w/36)}, (_, c) => `<rect x="${x+12+c*36}" y="${y+16+r*50}" width="18" height="24" stroke-width="1.4"/>`).join('')).join('')).join('')}
      <path d="M660 160 l50 -60 l50 60" /><circle cx="900" cy="90" r="34"/></svg>
    <div class="head">${line(0, 'h1')}${line(1, 'h2')}</div>
    ${P.big ? `<div class="big">${P.big}</div>` : ''}${person()}${cards()}${emoji()}`,
};
s.innerHTML = `<img class="logo" src="${ROOT}assets/logo.png">` + (LAYOUTS[L] || LAYOUTS.split)() +
  `<div class="foot"><span class="cta">${P.cta || 'বিস্তারিত জানুন'} →</span><span class="wa">${wa}${P.whatsapp || '+880 1872-692783'}</span><span class="web">samplewebsite.tech</span></div>`;
</script>
</body></html>
