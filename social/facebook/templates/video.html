<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css">
<script src="vendor/gsap.min.js"></script>
<style>
.stage{width:1080px;height:1920px;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font)}
/* ---------- themes ---------- */
.th-pop{--bg:#FFF4E6;--ink:#151515;--mut:#55504a;--a1:#C6F432;--a2:#FF8FCF;--a3:#4D6BFE;--a4:#FF6B2C;--card:#fff;--font:'Anek Bangla';--disp:'Anek Bangla';--line:#151515}
.th-brutal{--bg:#FFE14D;--ink:#111;--mut:#2b2b2b;--a1:#FF3D7F;--a2:#3DD6F5;--a3:#B4F05A;--a4:#FF9F43;--card:#fff;--font:'Baloo Da 2';--disp:'Baloo Da 2';--line:#111}
.th-mesh{--bg:#FF6A4D;--ink:#fff;--mut:rgba(255,255,255,.88);--a1:#fff;--a2:#FFD23F;--a3:#2b1650;--a4:#18C8FF;--card:rgba(255,255,255,.18);--font:'Hind Siliguri';--disp:'Hind Siliguri';--line:rgba(255,255,255,.5)}
.th-retro{--bg:#0E9C96;--ink:#FFF3D6;--mut:#E9FBF7;--a1:#FFC83C;--a2:#E8364F;--a3:#0A4F4C;--a4:#FFF3D6;--card:#FFF3D6;--font:'Hind Siliguri';--disp:'Galada';--line:#0A4F4C}

/* ---------- background layers ---------- */
#bg{position:absolute;inset:0;overflow:hidden}
.blob{position:absolute;border-radius:50%}
.th-pop .blob{opacity:1}
.th-mesh .blob{filter:blur(120px);opacity:.95}
.th-brutal #bg{background-image:linear-gradient(rgba(0,0,0,.08) 2px,transparent 2px),linear-gradient(90deg,rgba(0,0,0,.08) 2px,transparent 2px);background-size:90px 90px}
.th-brutal .blob{border:5px solid #111;box-shadow:10px 10px 0 #111}
.th-retro #bg:before{content:"";position:absolute;left:50%;top:50%;width:3200px;height:3200px;margin:-1600px 0 0 -1600px;background:repeating-conic-gradient(rgba(255,200,60,.2) 0 7.5deg,transparent 7.5deg 15deg);animation:none}
.th-retro #bg:after{content:"";position:absolute;inset:30px;border:7px dashed #FFC83C;border-radius:48px}

/* ---------- chrome ---------- */
.top{position:absolute;top:90px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.logo{height:44px}
.th-pop .logo,.th-brutal .logo{filter:brightness(0)}
.th-mesh .logo,.th-retro .logo{filter:brightness(0) invert(1)}
.dots{display:flex;gap:10px}.dots i{width:16px;height:16px;border-radius:99px;background:var(--ink);opacity:.25;transition:none}
.dots i.on{opacity:1;width:44px}
.cap{position:absolute;left:70px;right:70px;bottom:150px;z-index:6;display:flex;justify-content:center}
.cap span{font-family:'Hind Siliguri';font-weight:600;font-size:40px;line-height:1.35;text-align:center;padding:18px 34px;border-radius:24px;background:rgba(15,15,20,.86);color:#fff;max-width:940px}
.th-brutal .cap span{border-radius:0;border:4px solid #111;background:#fff;color:#111;box-shadow:8px 8px 0 #111}
.foot{position:absolute;left:80px;right:80px;bottom:70px;display:flex;justify-content:space-between;font-family:'Space Grotesk';font-weight:500;font-size:28px;z-index:5;color:var(--ink)}
.foot span{background:var(--chip,rgba(255,255,255,.8));padding:4px 14px;border-radius:12px}
.th-mesh,.th-retro{--chip:rgba(0,0,0,.35)}

/* ---------- scenes ---------- */
.scene{position:absolute;left:80px;right:80px;top:230px;bottom:330px;display:flex;flex-direction:column;justify-content:center;gap:46px;visibility:hidden;z-index:4}
.kick{align-self:flex-start;font-weight:700;font-size:38px;padding:12px 30px;border-radius:99px;background:var(--ink);color:var(--bg)}
.th-brutal .kick{border-radius:0;background:#fff;color:#111;border:4px solid #111;box-shadow:6px 6px 0 #111}
.th-mesh .kick{background:rgba(255,255,255,.25);color:#fff;border:2px solid rgba(255,255,255,.6)}
.th-retro .kick{background:var(--a2);color:#fff;box-shadow:0 6px 0 #8a1426}
h2{font-family:var(--disp);font-weight:800;font-size:112px;line-height:1.16;letter-spacing:-.005em}
.th-pop h2{font-stretch:88%}
.th-retro h2{font-weight:400;font-size:124px;text-shadow:6px 6px 0 #0A4F4C}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding:.12em .04em .22em;margin:-.12em -.04em -.22em}
.wi{display:inline-block;position:relative}
.hl .wi{z-index:1}
.mk{position:absolute;z-index:-1;transform-origin:left center}
.th-pop .hl .mk{left:-6px;right:-6px;top:52%;bottom:6%;background:var(--a1)}
.th-brutal .hl .wi{color:#fff}.th-brutal .hl .mk{left:-10px;right:-10px;top:8%;bottom:4%;background:var(--a1);border:5px solid #111}
.th-mesh .hl .wi{color:#FF4D6D}.th-mesh .hl .mk{left:-12px;right:-12px;top:10%;bottom:4%;background:#fff;border-radius:20px}
.th-retro .hl .wi{color:var(--a1)}.th-retro .hl .mk{display:none}
.body{font-size:50px;line-height:1.45;color:var(--mut);font-weight:500}
/* scene with a model cut-out: text sits in the top part, the person stands at the bottom */
.scene.wp{justify-content:flex-start;padding-top:20px;gap:34px}
.scene.wp h2{font-size:96px}.scene.wp .body{font-size:44px;max-width:860px}
.scene.wp .icon{width:170px;height:170px;font-size:92px;border-radius:46px}
.pp{position:absolute;bottom:-330px;height:1000px;z-index:-1;filter:drop-shadow(0 30px 50px rgba(0,0,0,.3))}
.pp.right{right:-110px}.pp.left{left:-110px}.pp.center{left:50%;margin-left:-330px}
.pcard{position:absolute;z-index:2;display:flex;align-items:center;gap:16px;padding:18px 26px;border-radius:28px;background:rgba(255,255,255,.92);box-shadow:0 20px 40px rgba(0,0,0,.18);font:700 34px 'Hind Siliguri';color:#1E1240;white-space:nowrap}
.pcard .emo{font-size:40px}
.th-brutal .pcard{border-radius:0;border:4px solid #111;box-shadow:8px 8px 0 #111}
.icon{width:220px;height:220px;border-radius:60px;display:grid;place-items:center;font-size:120px;background:var(--a2);font-family:'Noto Color Emoji'}
.th-brutal .icon{border:5px solid #111;box-shadow:12px 12px 0 #111;border-radius:0}
.th-mesh .icon{background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.6)}
.th-retro .icon{background:var(--a4);border-radius:50%;box-shadow:0 10px 0 var(--a3)}
.emo{font-family:'Noto Color Emoji'}

/* search */
.sbar{display:flex;align-items:center;gap:24px;background:#fff;color:#202124;border-radius:99px;padding:30px 40px;font-family:'Space Grotesk';font-size:48px;box-shadow:0 20px 50px rgba(0,0,0,.15)}
.th-brutal .sbar{border-radius:0;border:5px solid #111;box-shadow:10px 10px 0 #111}
.sbar svg{flex:none}
.caret{display:inline-block;width:4px;height:52px;background:#4D6BFE;vertical-align:middle;margin-left:4px}
.res{display:grid;gap:22px}
.rc{background:#fff;color:#202124;border-radius:30px;padding:28px 36px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 16px 40px rgba(0,0,0,.12)}
.th-brutal .rc{border-radius:0;border:5px solid #111;box-shadow:10px 10px 0 #111}
.rc b{display:block;font-size:44px;font-weight:700;color:#1a0dab}
.rc small{font-size:34px;color:#4d5156}
.rc .ok{font-size:64px}
.rc.bad{opacity:.55}.rc.bad b{color:#5f6368}

/* browser mock */
.browser{border-radius:30px;overflow:hidden;background:#fff;box-shadow:0 40px 80px rgba(0,0,0,.25)}
.th-brutal .browser{border-radius:0;border:5px solid #111;box-shadow:14px 14px 0 #111}
.bbar{height:64px;background:#ECEAF0;display:flex;align-items:center;gap:12px;padding:0 26px}
.bbar i{width:20px;height:20px;border-radius:50%;background:#FF5F57}.bbar i:nth-child(2){background:#FEBC2E}.bbar i:nth-child(3){background:#28C840}
.bbar span{margin-left:20px;flex:1;background:#fff;border-radius:99px;height:38px;font:500 24px 'Space Grotesk';color:#666;display:flex;align-items:center;padding:0 22px}
.shot{height:560px;overflow:hidden}.shot img{width:100%;height:100%;object-fit:cover;object-position:top;transform-origin:50% 0}
.chips{display:flex;flex-wrap:wrap;gap:18px}
.chip{font-weight:700;font-size:40px;padding:16px 32px;border-radius:99px;background:var(--card);color:var(--ink);box-shadow:0 10px 24px rgba(0,0,0,.1)}
.chip:nth-child(2){background:var(--a1);color:#151515}.chip:nth-child(3){background:var(--a2);color:#151515}.chip:nth-child(4){background:var(--a3);color:#fff}
.th-brutal .chip{border-radius:0;border:4px solid #111;box-shadow:6px 6px 0 #111}
.th-mesh .chip{color:#2b1650;background:#fff}.th-mesh .chip:nth-child(2){background:#FFD23F}
.th-retro .chip{background:var(--a4);color:var(--a3);box-shadow:0 6px 0 var(--a3)}

/* features */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.fc{border-radius:40px;padding:38px 34px;font-weight:700;font-size:46px;line-height:1.25;display:flex;flex-direction:column;gap:26px;min-height:300px;justify-content:space-between}
.fc .emo{font-size:84px}
.fc:nth-child(1){background:var(--a3);color:#fff}.fc:nth-child(2){background:var(--a1);color:#151515}.fc:nth-child(3){background:var(--a2);color:#151515}.fc:nth-child(4){background:var(--a4);color:#151515}
.th-brutal .fc{border-radius:0;border:5px solid #111;box-shadow:10px 10px 0 #111}
.th-mesh .fc{background:rgba(255,255,255,.2)!important;color:#fff!important;border:2px solid rgba(255,255,255,.55)}

/* cta */
.scene.cta{align-items:center;text-align:center}
.cta .kick{align-self:center}
.price{font-family:var(--disp);font-weight:800;font-size:190px;line-height:1;letter-spacing:-.02em}
.price small{font-size:60px;font-weight:700;display:block;margin-bottom:10px;color:var(--mut)}
.th-retro .price{font-weight:400;color:var(--a1);text-shadow:6px 6px 0 var(--a3)}
.wa{display:inline-flex;align-items:center;gap:20px;background:#25D366;color:#fff;font-weight:700;font-size:52px;padding:30px 56px;border-radius:99px;box-shadow:0 20px 40px rgba(37,211,102,.35)}
.th-brutal .wa{border-radius:0;border:5px solid #111;box-shadow:10px 10px 0 #111}
.phone{font-family:'Space Grotesk';font-weight:600;font-size:56px}
</style></head>
<body><div class="stage" id="s">
<div id="bg"></div>
<div class="top"><img class="logo" src="../../../assets/logo.png"><div class="dots" id="dots"></div></div>
<div id="scenes"></div>
<div class="cap"><span id="cap"></span></div>
<div class="foot"><span>samplewebsite.tech</span><span>WhatsApp +880 1872-692783</span></div>
</div>
<script>
// Deterministic motion renderer. render.js injects window.VIDEO = {theme, scenes, timing, captions}
// and then calls seek(t) once per frame. Everything is on one paused GSAP timeline.
const V = window.VIDEO;
const stage = document.getElementById('s');
stage.className = 'stage th-' + (V.theme || 'pop');
const TH = V.theme || 'pop';
// Theme personality: how things enter.
const M = {
  pop:    {ease: 'back.out(1.8)', dur: .7, from: {yPercent: 115, rotate: 4}},
  brutal: {ease: 'power4.out',    dur: .45, from: {yPercent: 120, rotate: -6}},
  mesh:   {ease: 'expo.out',      dur: 1.0, from: {yPercent: 100, filter: 'blur(14px)'}},
  retro:  {ease: 'elastic.out(1,.6)', dur: 1.1, from: {yPercent: 110, scale: .7}},
}[TH] || {};

gsap.ticker.lagSmoothing(0);
const tl = gsap.timeline({paused: true});

// ---------- background ----------
const bg = document.getElementById('bg');
const blobDefs = {
  pop:    [['#C6F432', 360, 760, -120, 0], ['#FF8FCF', 300, 860, 1300, 18], ['#4D6BFE', 220, -60, 1500, 0], ['#FF6B2C', 160, 900, 260, 30]],
  brutal: [['#FF3D7F', 200, 860, 330, 14], ['#3DD6F5', 160, -40, 1250, -10], ['#B4F05A', 130, 900, 1560, 8]],
  mesh:   [['#FFB84D', 900, -300, -200, 0], ['#FF4D8D', 800, 500, 300, 0], ['#7A5CFF', 900, -300, 1200, 0], ['#18C8FF', 700, 600, 1400, 0]],
  retro:  [],
}[TH] || [];
blobDefs.forEach(([c, size, x, y, r], i) => {
  const b = document.createElement('div');
  b.className = 'blob';
  Object.assign(b.style, {background: c, width: size + 'px', height: size + 'px', left: x + 'px', top: y + 'px', borderRadius: TH === 'brutal' && i % 2 ? '0' : '50%'});
  bg.appendChild(b);
  // Slow continuous drift across the whole video.
  tl.to(b, {x: (i % 2 ? -1 : 1) * 120, y: (i % 3 ? 1 : -1) * 160, rotate: r * 4, duration: V.total, ease: 'sine.inOut'}, 0);
});

// ---------- helpers ----------
const words = s => s.split(/(\*[^*]+\*)/).filter(Boolean).flatMap(seg => {
  const isHl = seg.startsWith('*');
  return seg.replace(/\*/g, '').split(/\s+/).filter(Boolean).map(w => ({w, hl: isHl}));
});
const title = s => `<h2>${words(s).map(({w, hl}) => `<span class="w${hl ? ' hl' : ''}"><span class="wi">${hl ? '<i class="mk"></i>' : ''}${w}</span></span>`).join(' ')}</h2>`;
const bn = n => String(n).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);
const searchSvg = '<svg width="52" height="52" viewBox="0 0 24 24"><circle cx="10" cy="10" r="7" fill="none" stroke="#4285F4" stroke-width="2.6"/><path d="M15.5 15.5L21 21" stroke="#4285F4" stroke-width="2.6" stroke-linecap="round"/></svg>';

function revealTitle(el, at) {
  const wi = el.querySelectorAll('.wi');
  tl.from(wi, {...M.from, duration: M.dur, ease: M.ease, stagger: .07}, at);
  el.querySelectorAll('.mk').forEach(mk => tl.from(mk, {scaleX: 0, duration: .5, ease: 'power3.inOut'}, at + .35 + wi.length * .07));
  return at + wi.length * .07 + M.dur * .6;
}
const popIn = (els, at, extra = {}) => tl.from(els, {y: 90, scale: .85, opacity: 0, duration: M.dur, ease: M.ease, stagger: .12, ...extra}, at);

// ---------- scene builders: each returns DOM and schedules its own tweens ----------
const B = {
  hook(sc, el, t0) {
    el.innerHTML = (sc.kicker ? `<span class="kick">${sc.kicker}</span>` : '') + title(sc.title);
    if (sc.kicker) tl.from(el.querySelector('.kick'), {scale: 0, rotate: -10, duration: .5, ease: 'back.out(2.5)'}, t0);
    revealTitle(el.querySelector('h2'), t0 + .2);
    tl.fromTo(el.querySelector('h2'), {scale: 1}, {scale: 1.05, duration: sc._dur, ease: 'none'}, t0);
  },
  search(sc, el, t0) {
    el.innerHTML = `<div class="sbar">${searchSvg}<span><span class="q"></span><i class="caret"></i></span></div>
      <div class="res">${sc.results.map(r => `<div class="rc${r.ok ? '' : ' bad'}"><div><b>${r.t}</b><small>${r.d}</small></div><span class="ok emo">${r.ok ? '✅' : '❌'}</span></div>`).join('')}</div>` + title(sc.title);
    const q = el.querySelector('.q');
    tl.from(el.querySelector('.sbar'), {y: -60, opacity: 0, scale: .9, duration: .6, ease: 'power3.out'}, t0);
    const typeDur = Math.min(1.6, sc.query.length * .08);
    tl.to({n: 0}, {n: sc.query.length, duration: typeDur, ease: 'none', onUpdate() { q.textContent = sc.query.slice(0, Math.round(this.targets()[0].n)); }}, t0 + .5);
    tl.to(el.querySelector('.caret'), {opacity: 0, duration: .01, repeat: Math.floor(sc._dur * 2), yoyo: true, repeatDelay: .45}, t0);
    popIn(el.querySelectorAll('.rc'), t0 + .6 + typeDur);
    el.querySelectorAll('.rc.bad').forEach(b => tl.to(b, {x: 14, duration: .06, repeat: 5, yoyo: true}, t0 + 1.4 + typeDur));
    revealTitle(el.querySelector('h2'), t0 + 1.2 + typeDur);
  },
  statement(sc, el, t0) {
    el.innerHTML = (sc.icon ? `<div class="icon">${sc.icon}</div>` : '') + title(sc.title) + (sc.body ? `<p class="body">${sc.body}</p>` : '');
    if (sc.icon) {
      tl.from(el.querySelector('.icon'), {scale: 0, rotate: -25, duration: .8, ease: 'elastic.out(1,.55)'}, t0);
      tl.to(el.querySelector('.icon'), {y: -16, duration: .9, repeat: Math.floor(sc._dur / .9), yoyo: true, ease: 'sine.inOut'}, t0 + .8);
    }
    const t1 = revealTitle(el.querySelector('h2'), t0 + .25);
    if (sc.body) tl.from(el.querySelector('.body'), {y: 40, opacity: 0, duration: .7, ease: 'power3.out'}, t1 + .1);
  },
  showcase(sc, el, t0) {
    el.innerHTML = title(sc.title) + `<div class="browser"><div class="bbar"><i></i><i></i><i></i><span>${sc.url || 'yourbusiness.com'}</span></div><div class="shot"><img src="../../../${sc.image}"></div></div>
      <div class="chips">${sc.chips.map(c => `<span class="chip">${c}</span>`).join('')}</div>`;
    const t1 = revealTitle(el.querySelector('h2'), t0);
    tl.from(el.querySelector('.browser'), {y: 200, rotateX: 25, opacity: 0, duration: .9, ease: 'power4.out', transformPerspective: 1200}, t0 + .3);
    tl.fromTo(el.querySelector('.shot img'), {scale: 1}, {scale: 1.18, duration: sc._dur, ease: 'none'}, t0);
    popIn(el.querySelectorAll('.chip'), t1 + .3, {stagger: .25});
  },
  features(sc, el, t0) {
    el.innerHTML = title(sc.title) + `<div class="grid">${sc.items.map(([e, l]) => `<div class="fc"><span class="emo">${e}</span>${l}</div>`).join('')}</div>`;
    const t1 = revealTitle(el.querySelector('h2'), t0);
    popIn(el.querySelectorAll('.fc'), t1, {stagger: .22, rotate: (i) => (i % 2 ? 6 : -6)});
  },
  cta(sc, el, t0) {
    el.classList.add('cta');
    el.innerHTML = `<span class="kick">${sc.kicker || 'NorthStar Dizital'}</span>` + title(sc.title) +
      `<div class="price"><small>${sc.priceLabel || 'শুরু মাত্র'}</small>৳<span class="pv">০</span></div>
       <span class="wa"><span class="emo">💬</span> WhatsApp করুন</span><span class="phone">+880 1872-692783</span>`;
    tl.from(el.querySelector('.kick'), {scale: 0, duration: .5, ease: 'back.out(2.5)'}, t0);
    const t1 = revealTitle(el.querySelector('h2'), t0 + .15);
    const pv = el.querySelector('.pv');
    tl.from(el.querySelector('.price'), {scale: .6, opacity: 0, duration: .6, ease: 'back.out(2)'}, t1);
    tl.to({n: 0}, {n: sc.price, duration: 1.3, ease: 'power3.out', onUpdate() { pv.textContent = bn(Math.round(this.targets()[0].n / 100) * 100).replace(/(\S)(\S{3})$/, '$1,$2'); }}, t1);
    tl.from(el.querySelector('.wa'), {y: 80, opacity: 0, duration: .6, ease: M.ease}, t1 + 1);
    tl.to(el.querySelector('.wa'), {scale: 1.07, duration: .45, repeat: Math.max(1, Math.floor((sc._dur - 2) / .45)), yoyo: true, ease: 'sine.inOut'}, t1 + 1.6);
    tl.from(el.querySelector('.phone'), {opacity: 0, y: 30, duration: .5}, t1 + 1.3);
  },
};

// ---------- assemble scenes on the timeline ----------
const root = document.getElementById('scenes');
const dots = document.getElementById('dots');
V.scenes.forEach((sc, i) => {
  const t0 = V.timing[i], t1 = V.timing[i + 1] ?? V.total;
  sc._dur = t1 - t0;
  const el = document.createElement('section');
  el.className = 'scene';
  root.appendChild(el);
  dots.insertAdjacentHTML('beforeend', '<i></i>');
  B[sc.type](sc, el, t0);
  if (sc.person) {
    // Model cut-out rises in from the bottom, then floats gently; optional cards pop beside it.
    el.classList.add('wp');
    const img = document.createElement('img');
    img.className = 'pp ' + (sc.person_side || 'right');
    img.src = '../../../' + sc.person;
    el.appendChild(img);
    tl.from(img, {y: 420, opacity: 0, duration: .9, ease: 'power3.out'}, t0 + .1);
    tl.to(img, {y: -14, duration: 1.6, repeat: Math.max(1, Math.floor(sc._dur / 1.6)), yoyo: true, ease: 'sine.inOut'}, t0 + 1);
    (sc.pcards || []).forEach((c, k) => {
      el.insertAdjacentHTML('beforeend', `<div class="pcard" style="left:${c.pos[0]}px;top:${c.pos[1]}px;transform:rotate(${c.rotate || 0}deg)"><span class="emo">${c.icon}</span>${c.text}</div>`);
      tl.from(el.lastElementChild, {scale: 0, opacity: 0, duration: .6, ease: 'back.out(2)'}, t0 + .9 + k * .35);
    });
  }
  tl.set(el, {visibility: 'visible'}, t0);
  tl.set(dots.children[i], {className: 'on'}, t0);
  if (i < V.scenes.length - 1) {
    // Exit: whole scene lifts and fades just before the next one starts.
    tl.to(el, {y: -120, opacity: 0, scale: .96, duration: .35, ease: 'power2.in'}, t1 - .35);
    tl.set(el, {visibility: 'hidden'}, t1);
    tl.set(dots.children[i], {className: ''}, t1);
  }
});
// Captions: each chunk is shown from its start time until the next one.
const cap = document.getElementById('cap');
V.captions.forEach(c => {
  tl.set(cap, {textContent: c.text}, c.t);
  tl.fromTo(cap, {y: 20, opacity: 0}, {y: 0, opacity: 1, duration: .2, immediateRender: false}, c.t);
});
tl.set({}, {}, V.total);
window.DURATION = V.total;
window.seek = t => { tl.seek(t, false); }; // return nothing: Playwright would try to serialize the timeline
seek(0);
