<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<style>
.stage{width:1080px;height:1920px}
.glow{transition:none}
.top{position:absolute;top:96px;left:90px;right:90px;display:flex;justify-content:space-between;align-items:center}
.count{font-size:28px;letter-spacing:.12em;color:var(--t2)}
.bar{position:absolute;left:90px;right:90px;top:180px;height:6px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--mg),var(--or))}
.scene{position:absolute;left:90px;right:90px;top:300px;bottom:260px;display:flex;flex-direction:column;justify-content:center;gap:48px;opacity:0}
.scene .num{font-size:200px;line-height:.8;font-weight:700;letter-spacing:-.05em;color:transparent;-webkit-text-stroke:2px rgba(180,154,255,.5)}
.scene h2{font-size:104px;line-height:1.02;letter-spacing:-.035em;font-weight:600}
.scene p{font-size:46px;line-height:1.38;color:var(--t2)}
.scene ul{list-style:none;display:grid;gap:22px;padding:40px 44px}
.scene li{font-size:44px;display:flex;gap:24px;line-height:1.25}
.scene li:before{content:"✓";color:var(--p);font-weight:700}
.scene .chip{align-self:flex-start;font-size:40px;padding:22px 40px}
.cap{position:absolute;left:90px;right:90px;bottom:120px;font-size:30px;color:var(--t2);display:flex;justify-content:space-between;letter-spacing:.04em}
.cap b{color:var(--tx);font-weight:500}
</style></head>
<body><div class="stage" id="s">
<div class="glow g1" id="g1" style="width:760px;height:760px"></div>
<div class="glow g2" id="g2" style="width:640px;height:640px"></div>
<div class="glow g3" id="g3" style="width:560px;height:560px;opacity:.3"></div>
<div class="grid-bg"></div>
<div class="top"><img class="logo" src="../../../assets/logo.png" alt=""><span class="count" id="count"></span></div>
<div class="bar"><i id="bar"></i></div>
<div id="scenes"></div>
<div class="cap"><b>samplewebsite.tech</b><span>WhatsApp +880 1872-692783</span></div>
</div>
<script>
// Deterministic renderer: render.js calls seek(t) for each frame and screenshots it.
const V = window.VIDEO || {scenes: []};
const hl = s => (s||'').replace(/\*(.+?)\*/g,'<span class="gt">$1</span>');
const root = document.getElementById('scenes');
let start = 0;
const scenes = V.scenes.map((sc, i) => {
  const el = document.createElement('section');
  el.className = 'scene';
  el.innerHTML =
    (sc.num ? `<div class="num part">${sc.num}</div>` : '') +
    (sc.kicker ? `<span class="kicker part">${sc.kicker}</span>` : '') +
    `<h2 class="part">${hl(sc.title)}</h2>` +
    (sc.body ? `<p class="part">${sc.body}</p>` : '') +
    (sc.points ? `<ul class="glass part">${sc.points.map(p => `<li>${p}</li>`).join('')}</ul>` : '') +
    (sc.chip ? `<span class="chip part">${sc.chip}</span>` : '');
  root.appendChild(el);
  const s = {el, parts: [...el.querySelectorAll('.part')], t0: start, t1: start + sc.dur, i};
  start += sc.dur;
  return s;
});
window.DURATION = start;
const ease = x => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3);
window.seek = t => {
  const W = 1080, H = 1920;
  const g = (id, x, y) => { const e = document.getElementById(id); e.style.left = x + 'px'; e.style.top = y + 'px'; };
  g('g1', -260 + 120 * Math.sin(t * .5), -200 + 160 * Math.cos(t * .4));
  g('g2', W - 380 + 140 * Math.cos(t * .45), 700 + 220 * Math.sin(t * .35));
  g('g3', 160 + 180 * Math.sin(t * .3), H - 420 + 120 * Math.cos(t * .5));
  document.getElementById('bar').style.width = (100 * t / start) + '%';
  for (const s of scenes) {
    const local = t - s.t0, left = s.t1 - t;
    if (local < 0 || left <= 0) { s.el.style.opacity = 0; continue; }
    const out = s.i === scenes.length - 1 ? 1 : ease(left / .35);
    s.el.style.opacity = out;
    s.el.style.transform = `translateY(${-30 * (1 - out)}px)`;
    s.parts.forEach((p, k) => {
      const a = ease((local - .12 * k) / .55);
      p.style.opacity = a;
      p.style.transform = `translateY(${50 * (1 - a)}px)`;
    });
    document.getElementById('count').textContent = `${String(s.i + 1).padStart(2, '0')} / ${String(scenes.length).padStart(2, '0')}`;
  }
};
seek(0);
</script>
</body></html>
